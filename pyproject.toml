[tool.ruff]
exclude = [
    ".venv",
    "**/.venv",
    "__pycache__",
    "**/__pycache__",
]

[tool.ruff.lint]
# Pre-existing violations suppressed to keep CI green; cleaned up incrementally.
# F401 unused imports, F811 redefinition, E402 module-level import order,
# E701 multiple statements on one line, E712 equality comparisons to True/False
# — these exist in pre-existing code and will be cleaned up incrementally.
# B008 FastAPI File(...)/Form(...)/Depends(...) in default args — intentional pattern.
ignore = ["F401", "F811", "E402", "E701", "E712", "B008"]
