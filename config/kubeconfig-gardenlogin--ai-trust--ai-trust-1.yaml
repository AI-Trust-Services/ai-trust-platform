apiVersion: v1
kind: Config
current-context: garden-ai-trust--ai-trust-1-external
contexts:
  - name: garden-ai-trust--ai-trust-1-external
    context:
      cluster: garden-ai-trust--ai-trust-1-external
      user: garden-ai-trust--ai-trust-1
      namespace: default
  - name: garden-ai-trust--ai-trust-1-internal
    context:
      cluster: garden-ai-trust--ai-trust-1-internal
      user: garden-ai-trust--ai-trust-1
      namespace: default
clusters:
  - name: garden-ai-trust--ai-trust-1-external
    cluster:
      server: >-
        https://api.ai-trust-1.ai-trust.shoot.gardener.cc-one.showroom.apeirora.eu
      certificate-authority-data: >-
        
      extensions: &ref_0
        - name: client.authentication.k8s.io/exec
          extension:
            shootRef:
              namespace: garden-ai-trust
              name: ai-trust-1
            gardenClusterIdentity: landscape-apeirora-one
  - name: garden-ai-trust--ai-trust-1-internal
    cluster:
      server: >-
        https://api.ai-trust-1.ai-trust.internal.gardener.cc-one.showroom.apeirora.eu
      certificate-authority-data: >-
        
      extensions: *ref_0
users:
  - name: garden-ai-trust--ai-trust-1
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: kubectl-gardenlogin
        args:
          - get-client-certificate
        provideClusterInfo: true
        interactiveMode: IfAvailable
        installHint: >-
          Follow the instructions on

          - https://github.com/gardener/gardenlogin#installation to install and

          - https://github.com/gardener/gardenlogin#configure-gardenlogin to
          configure the gardenlogin credential plugin.


          The following is a sample configuration for gardenlogin as well as
          gardenctl. Place the file under ~/.garden/gardenctl-v2.yaml.


          ---

          gardens:
            - identity: landscape-apeirora-one
              kubeconfig: "<path-to-garden-cluster-kubeconfig>"
          ...


          Alternatively, you can run the following gardenctl command:


          $ gardenctl config set-garden landscape-apeirora-one --kubeconfig
          "<path-to-garden-cluster-kubeconfig>"


          Note that the kubeconfig refers to the path of the garden cluster
          kubeconfig which you can download from the Account page.
