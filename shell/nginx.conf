server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (SEC-H1/H2/H3). MFEs are served SAME-ORIGIN through this shell and
    # embedded by the Luigi shell in iframes, so frame-ancestors 'self' keeps Luigi working
    # while blocking third-party framing (replaces the invalid X-Frame-Options "ALLOWALL").
    # CORS wildcard removed: /api/* is same-origin via this proxy, so no ACAO is needed on an
    # authenticated (cookie) app. HSTS/nosniff/Referrer-Policy added.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shell static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Frontend MFEs ──
    location /registry/ {
        proxy_pass http://ai-system-registry-frontend:80/;
        proxy_set_header Host $host;
    }
    location /monitoring/ {
        proxy_pass http://monitoring-frontend:80/;
        proxy_set_header Host $host;
    }
    location /overview/ {
        proxy_pass http://overview-frontend:80/;
        proxy_set_header Host $host;
    }
    location /alerts/ {
        proxy_pass http://alerts-frontend:80/;
        proxy_set_header Host $host;
    }
    location /compliance/ {
        proxy_pass http://compliance-frontend:80/;
        proxy_set_header Host $host;
    }
    location /dta/ {
        proxy_pass http://decision-trace-analyzer-frontend:80/;
        proxy_set_header Host $host;
    }
    location /users/ {
        proxy_pass http://users-frontend:80/;
        proxy_set_header Host $host;
    }

    # ── Backend APIs ──
    # Identity + tenancy headers forwarded to every backend:
    #   X-Forwarded-User / X-Forwarded-Preferred-Username — authZ (OpenFGA user, set by oauth2-proxy)
    #   Authorization — the OIDC JWT (carries the tenant_id claim / issuer); read + VERIFIED by
    #     libs/tenancy jwt mode. This is the sole tenant source in jwt mode.
    # SEC-C1: the inbound client X-Tenant-Id is STRIPPED (set to "") on every /api/* block so a
    #   user cannot forge a tenant. jwt mode ignores it anyway; header mode (trusted proxy only)
    #   must have that proxy set X-Tenant-Id upstream of this shell.
    location /api/registry/ {
        proxy_pass http://ai-system-registry-backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/monitoring/ {
        proxy_pass http://monitoring-backend:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/overview/ {
        proxy_pass http://overview-backend:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/alerts/ {
        proxy_pass http://alerts-backend:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/compliance/ {
        proxy_pass http://compliance-backend:8007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/dta/ {
        proxy_pass http://decision-trace-analyzer-backend:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/users/ {
        proxy_pass http://users-backend:8008/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
}
