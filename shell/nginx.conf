server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS — re-resolve every 10s so container restarts don't cause 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Frame-Options "ALLOWALL";
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
    add_header Access-Control-Allow-Headers "*";

    # Shell static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Frontend MFEs ──
    location /registry/ {
        set $upstream http://ai-system-registry-frontend:80;
        rewrite ^/registry/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /monitoring/ {
        set $upstream http://monitoring-frontend:80;
        rewrite ^/monitoring/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /overview/ {
        set $upstream http://overview-frontend:80;
        rewrite ^/overview/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /alerts/ {
        set $upstream http://alerts-frontend:80;
        rewrite ^/alerts/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /compliance/ {
        set $upstream http://compliance-frontend:80;
        rewrite ^/compliance/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /dta/ {
        set $upstream http://decision-trace-analyzer-frontend:80;
        rewrite ^/dta/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /users/ {
        set $upstream http://users-frontend:80;
        rewrite ^/users/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /risk-management/ {
        set $upstream http://risk-management-frontend:80;
        rewrite ^/risk-management/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    # ── Backend APIs ──
    # Note: proxy_pass with a variable does not strip the location prefix automatically.
    # We use rewrite + $request_uri to forward the full path minus the location prefix.
    location /api/registry/ {
        set $upstream http://ai-system-registry-backend:8001;
        rewrite ^/api/registry/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
    }
    location /api/monitoring/ {
        set $upstream http://monitoring-backend:8003;
        rewrite ^/api/monitoring/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
    }
    location /api/overview/ {
        set $upstream http://overview-backend:8004;
        rewrite ^/api/overview/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
    }
    location /api/alerts/ {
        set $upstream http://alerts-backend:8005;
        rewrite ^/api/alerts/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
    }
    location /api/compliance/ {
        set $upstream http://compliance-backend:8007;
        rewrite ^/api/compliance/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
    }
    location /api/dta/ {
        set $upstream http://decision-trace-analyzer-backend:8006;
        rewrite ^/api/dta/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
    }
    location /api/users/ {
        set $upstream http://users-backend:8008;
        rewrite ^/api/users/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/risk-management/ {
        set $upstream http://risk-management-backend:8009;
        rewrite ^/api/risk-management/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
    }
}
