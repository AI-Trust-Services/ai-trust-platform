server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "ALLOWALL";
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
    add_header Access-Control-Allow-Headers "*";

    # Shell static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Frontend MFEs ──
    location /registry/ {
        proxy_pass http://ai-system-registry-frontend:80/;
        proxy_set_header Host $host;
    }
    location /monitoring/ {
        proxy_pass http://monitoring-frontend:80/;
        proxy_set_header Host $host;
    }
    location /overview/ {
        proxy_pass http://overview-frontend:80/;
        proxy_set_header Host $host;
    }
    location /alerts/ {
        proxy_pass http://alerts-frontend:80/;
        proxy_set_header Host $host;
    }
    location /compliance/ {
        proxy_pass http://compliance-frontend:80/;
        proxy_set_header Host $host;
    }
    location /dta/ {
        proxy_pass http://decision-trace-analyzer-frontend:80/;
        proxy_set_header Host $host;
    }
    location /users/ {
        proxy_pass http://users-frontend:80/;
        proxy_set_header Host $host;
    }

    # ── Backend APIs ──
    # Identity + tenancy headers forwarded to every backend:
    #   X-Forwarded-User / X-Forwarded-Preferred-Username — authZ (OpenFGA user, set by oauth2-proxy)
    #   Authorization — the OIDC JWT (carries the tenant_id claim / issuer); read by libs/tenancy jwt mode
    #   X-Tenant-Id — optional explicit tenant override injected upstream by the mesh
    # Single-tenant mode (TENANCY_MODE=single) ignores the tenant signals; authZ headers are always used.
    location /api/registry/ {
        proxy_pass http://ai-system-registry-backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }
    location /api/monitoring/ {
        proxy_pass http://monitoring-backend:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }
    location /api/overview/ {
        proxy_pass http://overview-backend:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }
    location /api/alerts/ {
        proxy_pass http://alerts-backend:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }
    location /api/compliance/ {
        proxy_pass http://compliance-backend:8007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }
    location /api/dta/ {
        proxy_pass http://decision-trace-analyzer-backend:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }
    location /api/users/ {
        proxy_pass http://users-backend:8008/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
    }
}
