server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS — re-resolve every 10s so container restarts don't cause 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers (SEC-H1/H2/H3). MFEs are served SAME-ORIGIN through this shell and
    # embedded by the Luigi shell in iframes, so frame-ancestors 'self' keeps Luigi working
    # while blocking third-party framing (replaces the invalid X-Frame-Options "ALLOWALL").
    # CORS wildcard removed: /api/* is same-origin via this proxy, so no ACAO is needed on an
    # authenticated (cookie) app. HSTS/nosniff/Referrer-Policy added.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shell static files
    # luigi-config.js carries the nav + sign-out wiring; it MUST NOT be served stale from the
    # browser cache (a cached copy kept the old logout href → sign-out silently re-logged in).
    # no-cache = always revalidate (cheap 304 when unchanged), so config changes propagate next load.
    location = /luigi-config.js {
        # add_header in a child block drops all parent add_header directives (nginx inheritance rule),
        # so security headers must be repeated in every location that defines its own add_header.
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Prevent browser from caching index.html so oauth2-proxy can redirect
        # to Keycloak login after sign-out instead of serving stale shell.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # Override the global frame-ancestors 'self' for the shell itself so Luigi
        # can embed it. MFEs served at /registry/, /compliance/, etc. inherit the
        # global SAMEORIGIN — same-origin via this proxy so Luigi iframing works.
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── Frontend MFEs ──
    location /registry/ {
        set $upstream http://ai-system-registry-frontend:80;
        rewrite ^/registry/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /monitoring/ {
        set $upstream http://monitoring-frontend:80;
        rewrite ^/monitoring/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /overview/ {
        set $upstream http://overview-frontend:80;
        rewrite ^/overview/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /alerts/ {
        set $upstream http://alerts-frontend:80;
        rewrite ^/alerts/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /compliance/ {
        set $upstream http://compliance-frontend:80;
        rewrite ^/compliance/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /dta/ {
        set $upstream http://decision-trace-analyzer-frontend:80;
        rewrite ^/dta/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /users/ {
        set $upstream http://users-frontend:80;
        rewrite ^/users/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
    location /risk-management/ {
        set $upstream http://risk-management-frontend:80;
        rewrite ^/risk-management/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    # ── Backend APIs ──
    # Identity + tenancy headers forwarded to every backend:
    #   X-Forwarded-User / X-Forwarded-Preferred-Username — authZ (OpenFGA user, set by oauth2-proxy)
    #   Authorization — the OIDC JWT (carries the tenant_id claim / issuer); read + VERIFIED by
    #     libs/tenancy jwt mode. This is the sole tenant source in jwt mode.
    # SEC-C1: the inbound client X-Tenant-Id is STRIPPED (set to "") on every /api/* block so a
    #   user cannot forge a tenant. jwt mode ignores it anyway; header mode (trusted proxy only)
    #   must have that proxy set X-Tenant-Id upstream of this shell.
    location /api/registry/ {
        set $upstream http://ai-system-registry-backend:8001;
        rewrite ^/api/registry/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
        # AI-assisted registration (LLM calls + document uploads) needs a longer read timeout + larger
        # body limit than the other backends. (from luka/shadcn-poc)
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
    location /api/monitoring/ {
        set $upstream http://monitoring-backend:8003;
        rewrite ^/api/monitoring/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/overview/ {
        set $upstream http://overview-backend:8004;
        rewrite ^/api/overview/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/alerts/ {
        set $upstream http://alerts-backend:8005;
        rewrite ^/api/alerts/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/compliance/ {
        set $upstream http://compliance-backend:8007;
        rewrite ^/api/compliance/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/dta/ {
        set $upstream http://decision-trace-analyzer-backend:8006;
        rewrite ^/api/dta/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/users/ {
        set $upstream http://users-backend:8008;
        rewrite ^/api/users/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Id "";
    }
    location /api/risk-management/ {
        set $upstream http://risk-management-backend:8009;
        rewrite ^/api/risk-management/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
    }
}
