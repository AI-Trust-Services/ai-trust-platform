<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trust Platform</title>
  <link rel="stylesheet" href="luigi_horizon.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: "72", "72full", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  </style>
  <script>
    // Set Luigi's collapsed nav preference before Luigi initialises.
    // This ensures the sidebar starts collapsed on every fresh browser/machine.
    var LUIGI_NAV_KEY = "luigi.preferences.navigation.collapsedNavigation";
    if (!localStorage.getItem(LUIGI_NAV_KEY)) {
      localStorage.setItem(LUIGI_NAV_KEY, "true");
    }
  </script>
</head>
<body>
  <script src="luigi.js"></script>
  <script src="luigi-config.js"></script>
</body>
</html>
