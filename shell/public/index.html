<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trust</title>
  <link rel="icon" href="/brand/svg/Icon_color.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@luigi-project/core@2.31.0/luigi_horizon.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <script>
    // Apply dark mode synchronously before first paint to prevent flash.
    (function(){var k='trust-platform-theme',d=localStorage.getItem(k)==='dark';document.documentElement.classList.toggle('dark',d);document.documentElement.style.background=d?'#09090b':'#ffffff';})();
    // Set Luigi's collapsed nav preference before Luigi initialises.
    // This ensures the sidebar starts collapsed on every fresh browser/machine.
    var LUIGI_NAV_KEY = "luigi.preferences.navigation.collapsedNavigation";
    if (!localStorage.getItem(LUIGI_NAV_KEY)) {
      localStorage.setItem(LUIGI_NAV_KEY, "true");
    }
  </script>
</head>
<body>
  <script src="https://unpkg.com/@luigi-project/core@2.31.0/luigi.js"></script>
  <script src="luigi-config.js"></script>
</body>
</html>
