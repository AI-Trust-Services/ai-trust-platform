name: PR Deployment Test

# Triggered by adding the "garden-deploy" label to a PR.
# Builds the PR branch and deploys it to the PR author's namespace on ai-trust-test.
#
# Prerequisites (one-time per developer namespace):
#   bash k8s/gardener_init/shoot-cluster-init.sh ai-trust-test --namespace=<github-username>
#
# Usage: add the "garden-deploy" label to a PR.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
  id-token: write
  packages: write

concurrency:
  group: ${{ github.actor }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Parse garden-deploy
    runs-on: ubuntu-latest
    if: github.event.label.name == 'garden-deploy'
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_sha: ${{ steps.pr.outputs.pr_sha }}
      pr_branch: ${{ steps.pr.outputs.pr_branch }}
      pr_author: ${{ steps.pr.outputs.pr_author }}
      pr_author_lower: ${{ steps.pr.outputs.pr_author_lower }}
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - name: Check authorization (org members only)
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          if [[ "$PERMISSION" == "admin" || "$PERMISSION" == "write" || "$PERMISSION" == "maintain" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.actor }} has ${PERMISSION} permission — authorized."
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "${{ github.actor }} has ${PERMISSION} permission — unauthorized."
          fi

      - name: Reject unauthorized request
        if: steps.auth.outputs.authorized != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "❌ @${{ github.actor }} Only org members can trigger deployment."
          exit 1

      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_sha=${PR_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_branch=${PR_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "pr_author=${PR_AUTHOR}" >> "$GITHUB_OUTPUT"
          echo "pr_author_lower=${PR_AUTHOR,,}" >> "$GITHUB_OUTPUT"
          echo "--- PR details ---"
          echo "pr_number:      ${PR_NUMBER}"
          echo "pr_branch:      ${PR_BRANCH}"
          echo "pr_author:      ${PR_AUTHOR}"
          echo "pr_author_lower:${PR_AUTHOR,,}"
          echo "pr_sha:         ${PR_SHA}"

  post-start:
    name: Post deployment started
    needs: dispatch
    if: needs.dispatch.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post "Test deployment started" comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.dispatch.outputs.pr_number }}
          PR_SHA: ${{ needs.dispatch.outputs.pr_sha }}
          PR_AUTHOR_LOWER: ${{ needs.dispatch.outputs.pr_author_lower }}
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "🚀 Test deployment started — deploying \`feature:${PR_SHA::12}\` to namespace \`${PR_AUTHOR_LOWER}\` on \`ai-trust-test\`."

      - name: Set pending commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_SHA: ${{ needs.dispatch.outputs.pr_sha }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${PR_SHA} \
            -f state=pending \
            -f context=deploy-test \
            -f description="Deploy test in progress..." \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    name: Build and deploy PR branch
    needs: dispatch
    if: needs.dispatch.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute variables
        id: vars
        uses: ./.github/actions/compute-vars
        with:
          branch: ${{ needs.dispatch.outputs.pr_branch }}
          gardener_cluster: ai-trust-test
          namespace: ${{ needs.dispatch.outputs.pr_author_lower }}

      - name: Build and push images
        uses: ./.github/actions/build-images
        with:
          owner: ${{ steps.vars.outputs.owner }}
          tag: ${{ steps.vars.outputs.tag }}
          ref: ${{ steps.vars.outputs.ref }}

      - name: Package and push Helm chart
        uses: ./.github/actions/package-chart
        with:
          owner: ${{ steps.vars.outputs.owner }}
          tag: ${{ steps.vars.outputs.tag }}

      - name: Build and push OCM component
        uses: ./.github/actions/publish-ocm
        with:
          owner: ${{ steps.vars.outputs.owner }}
          tag: ${{ steps.vars.outputs.tag }}

      - name: Deploy to cluster
        uses: ./.github/actions/apply-to-cluster
        with:
          cluster: ${{ steps.vars.outputs.cluster }}
          ocm_version: ${{ steps.vars.outputs.tag }}
          namespace: ${{ steps.vars.outputs.namespace }}
          github_actor: ${{ github.actor }}
          app_admin_password: ${{ secrets.APP_ADMIN_PASSWORD }}
          clickhouse_password: ${{ secrets.CLICKHOUSE_PASSWORD }}
          keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          keycloak_client_secret: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          minio_root_password: ${{ secrets.MINIO_ROOT_PASSWORD }}
          oauth2_proxy_cookie_secret: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}
          postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          users_backend_client_secret: ${{ secrets.USERS_BACKEND_CLIENT_SECRET }}
          dev_user_password: ${{ secrets.DEV_USER_PASSWORD }}

  post-result:
    name: Post deployment result
    needs: [dispatch, deploy]
    if: always() && needs.dispatch.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post success comment and status
        if: needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.dispatch.outputs.pr_number }}
          PR_SHA: ${{ needs.dispatch.outputs.pr_sha }}
          PR_AUTHOR_LOWER: ${{ needs.dispatch.outputs.pr_author_lower }}
        run: |
          APP_URL="https://${PR_AUTHOR_LOWER}.ai-trust-test.ai-trust.shoot.gardener.cc-one.showroom.apeirora.eu"
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "✅ Test deployment successful: \`feature:${PR_SHA::12}\` deployed to namespace \`${PR_AUTHOR_LOWER}\` on \`ai-trust-test\`."$'\n\n'"🔗 ${APP_URL}"

          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${PR_SHA} \
            -f state=success \
            -f context=deploy-test \
            -f description="Deploy test passed (feature:${PR_SHA::12})" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post app URL to linked issues
        if: needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.dispatch.outputs.pr_number }}
          PR_AUTHOR_LOWER: ${{ needs.dispatch.outputs.pr_author_lower }}
          PR_SHA: ${{ needs.dispatch.outputs.pr_sha }}
        run: |
          APP_URL="https://${PR_AUTHOR_LOWER}.ai-trust-test.ai-trust.shoot.gardener.cc-one.showroom.apeirora.eu"
          ISSUES=$(gh api graphql -f query='
            {
              repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                pullRequest(number: '"${PR_NUMBER}"') {
                  closingIssuesReferences(first: 10) {
                    nodes { number }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')
          for ISSUE in $ISSUES; do
            gh issue comment "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --body "🚀 Test deployment for PR #${PR_NUMBER} (\`feature:${PR_SHA::12}\`) is live:"$'\n\n'"🔗 ${APP_URL}"
            echo "Posted to issue #${ISSUE}"
          done

      - name: Post failure comment and status
        if: needs.deploy.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.dispatch.outputs.pr_number }}
          PR_SHA: ${{ needs.dispatch.outputs.pr_sha }}
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "❌ Test deployment failed: \`feature:${PR_SHA::12}\` — see [run logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${PR_SHA} \
            -f state=failure \
            -f context=deploy-test \
            -f description="Deploy test failed (feature:${PR_SHA::12})" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
