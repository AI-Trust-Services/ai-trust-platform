name: Build and Push Images

# Builds every locally-built image (mirrors k8s/scripts/build-and-load-images.sh)
# and pushes it to ghcr.io. Third-party images (postgres, keycloak, openfga,
# oauth2-proxy, rabbitmq, clickhouse-server, minio, otel-collector-contrib) are
# not built here - the Helm chart pulls them straight from their upstream
# registries, same as docker-compose.
#
# Automatic (push to main): builds images tagged ai-trust-main/<sha> and
# automatically triggers deploy-gardener.yml targeting ai-trust-main.
#
# Manual (workflow_dispatch): optional branch (default: main) and
# gardener_cluster (default: ai-trust-main) inputs. Images are tagged
# <cluster>/<sha> so each cluster has its own isolated image path in the
# registry and will never accidentally pull another cluster's latest image.

on:
  push:
    # TODO: remove "20-set-up-cicd-pipeline-for-ai-trust-platform" before merging to main
    branches: [main, "20-set-up-cicd-pipeline-for-ai-trust-platform"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (default: the branch this workflow runs on)"
        required: false
        default: ""
      gardener_cluster:
        description: "Gardener cluster to deploy to after build"
        required: false
        default: ai-trust-main
        type: choice
        options:
          - ai-trust-main
          - sr-test
          - none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.gardener_cluster || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      tag: ${{ steps.vars.outputs.tag }}
      cluster: ${{ steps.vars.outputs.cluster }}
      deploy: ${{ steps.vars.outputs.deploy }}
      ref: ${{ steps.vars.outputs.ref }}
    steps:
      - name: Compute image owner / tag / cluster
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          # Which branch/ref to check out
          if [[ -n "${{ inputs.branch }}" ]]; then
            echo "ref=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

          # Determine target cluster and whether to trigger a deploy
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            cluster="ai-trust-main"
            deploy="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.gardener_cluster }}" != "none" ]]; then
            cluster="${{ inputs.gardener_cluster }}"
            deploy="true"
          else
            cluster="none"
            deploy="false"
          fi
          echo "cluster=${cluster}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"

          # Image tag:
          #   - git version tag  → the version string (e.g. v1.2.3)
          #   - cluster deploy   → <cluster>/<short-sha>  (isolated per cluster)
          #   - build-only       → <short-sha>
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${deploy}" == "true" ]]; then
            echo "tag=${cluster}/${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── backends built from repo root (context .) ──
          - name: users-backend
            context: .
            dockerfile: users/backend/Dockerfile
          - name: ai-system-registry-backend
            context: .
            dockerfile: ai-system-registry/backend/Dockerfile
          - name: monitoring-backend
            context: .
            dockerfile: monitoring/backend/Dockerfile
          - name: overview-backend
            context: .
            dockerfile: overview/backend/Dockerfile
          - name: alerts-backend
            context: .
            dockerfile: alerts/backend/Dockerfile
          - name: compliance-backend
            context: .
            dockerfile: compliance/backend/Dockerfile
          - name: decision-trace-analyzer-backend
            context: .
            dockerfile: decision-trace-analyzer/backend/Dockerfile
          - name: policy-checker-worker
            context: .
            dockerfile: policy-checker-worker/Dockerfile
          - name: otel-clickhouse-consumer
            context: .
            dockerfile: consumers/clickhouse-consumer/Dockerfile
          - name: openfga-provision
            context: .
            dockerfile: infra/openfga-provision/Dockerfile

          # ── one-shot migration images (own context) ──
          - name: db-migrate
            context: ./libs/persistence
            dockerfile: ./libs/persistence/Dockerfile
          - name: clickhouse-migrate
            context: ./libs/clickhouse
            dockerfile: ./libs/clickhouse/Dockerfile

          # ── other own-context images ──
          - name: keycloak-provision
            context: ./infra/keycloak
            dockerfile: ./infra/keycloak/Dockerfile
          - name: shell
            context: ./shell
            dockerfile: ./shell/Dockerfile
          - name: otel-rmq-bridge
            context: ./otel-pipeline/rmq-bridge
            dockerfile: ./otel-pipeline/rmq-bridge/Dockerfile

          # ── frontends (Vite build args baked in, same as docker-compose args:) ──
          - name: ai-system-registry-frontend
            context: ./ai-system-registry/frontend
            dockerfile: ./ai-system-registry/frontend/Dockerfile
            build_args: |
              VITE_REGISTRY_API_BASE=${{ vars.VITE_REGISTRY_API_BASE || '/api/registry/v1' }}
              VITE_USERS_API_BASE=${{ vars.VITE_USERS_API_BASE || '/api/users/v1' }}
          - name: monitoring-frontend
            context: ./monitoring/frontend
            dockerfile: ./monitoring/frontend/Dockerfile
            build_args: |
              VITE_MONITORING_API_BASE=${{ vars.VITE_MONITORING_API_BASE || '/api/monitoring/v1' }}
          - name: overview-frontend
            context: ./overview/frontend
            dockerfile: ./overview/frontend/Dockerfile
            build_args: |
              VITE_OVERVIEW_API_BASE=${{ vars.VITE_OVERVIEW_API_BASE || '/api/overview/v1' }}
              VITE_ALERTS_API_BASE=${{ vars.VITE_ALERTS_API_BASE || '/api/alerts/v1' }}
              VITE_ALERTS_URL=${{ vars.VITE_ALERTS_URL || 'http://localhost:8080/alerts' }}
              VITE_REGISTRY_URL=${{ vars.VITE_REGISTRY_URL || 'http://localhost:8080/registry' }}
              VITE_COMPLIANCE_URL=${{ vars.VITE_COMPLIANCE_URL || 'http://localhost:8080/compliance' }}
              VITE_COMPLIANCE_API_BASE=${{ vars.VITE_COMPLIANCE_API_BASE || '/api/compliance/v1' }}
              VITE_USERS_API_BASE=${{ vars.VITE_USERS_API_BASE || '/api/users/v1' }}
          - name: alerts-frontend
            context: ./alerts/frontend
            dockerfile: ./alerts/frontend/Dockerfile
            build_args: |
              VITE_ALERTS_API_BASE=${{ vars.VITE_ALERTS_API_BASE || '/api/alerts/v1' }}
              VITE_ALERTS_URL=${{ vars.VITE_ALERTS_URL || 'http://localhost:8080/alerts' }}
              VITE_USERS_API_BASE=${{ vars.VITE_USERS_API_BASE || '/api/users/v1' }}
          - name: compliance-frontend
            context: ./compliance/frontend
            dockerfile: ./compliance/frontend/Dockerfile
            build_args: |
              VITE_COMPLIANCE_API_BASE=${{ vars.VITE_COMPLIANCE_API_BASE || '/api/compliance/v1' }}
              VITE_REGISTRY_API_BASE=${{ vars.VITE_REGISTRY_API_BASE || '/api/registry/v1' }}
              VITE_USERS_API_BASE=${{ vars.VITE_USERS_API_BASE || '/api/users/v1' }}
          - name: users-frontend
            context: ./users/frontend
            dockerfile: ./users/frontend/Dockerfile
            build_args: |
              VITE_USERS_API_BASE=${{ vars.VITE_USERS_API_BASE || '/api/users/v1' }}
          - name: decision-trace-analyzer-frontend
            context: ./decision-trace-analyzer/frontend
            dockerfile: ./decision-trace-analyzer/frontend/Dockerfile
            build_args: |
              VITE_DTA_API_BASE=${{ vars.VITE_DTA_API_BASE || '/api/dta/v1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/ai-trust-platform/${{ matrix.name }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  images-published:
    name: All Images Published
    needs: [prepare, build-push]
    if: always()
    outputs:
      deploy: ${{ needs.prepare.outputs.deploy }}
      cluster: ${{ needs.prepare.outputs.cluster }}
      tag: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.build-push.result }}" != "success" ]]; then
            echo "::error::One or more image builds did not succeed"
            exit 1
          fi
          echo "All images published successfully."

  deploy:
    name: Deploy to Gardener (${{ needs.images-published.outputs.cluster }})
    needs: images-published
    if: needs.images-published.result == 'success' && needs.images-published.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy-gardener.yml
    with:
      cluster: ${{ needs.images-published.outputs.cluster }}
      image_tag: ${{ needs.images-published.outputs.tag }}
    secrets:
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
