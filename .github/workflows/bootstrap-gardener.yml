name: Bootstrap Gardener Cluster

# Runs the namespace/secret bootstrap and applies OCM CRs so the OCM controller
# + Flux can take over the actual Helm deployment. Called automatically by
# build-push-deploy.yml on every main merge, and can also be triggered manually.
#
# Prerequisites (one-time, per cluster):
#   bash k8s/gardener_init/shoot-cluster-init.sh <cluster-name>
#   (installs Traefik, OCM controller, Flux, certs, DNS)
#
# Required GitHub secret (gardener environment):
#   GHCR_PULL_TOKEN   - PAT with read:packages (only if ghcr.io packages are private)

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Target cluster"
        required: true
        default: ai-trust-main
        type: choice
        options:
          - ai-trust-main
          - sr-test
      ocm_version:
        description: "Exact OCM component version to pin (e.g. ai-trust-main-abc123def456)"
        required: true
        type: string
  workflow_call:
    inputs:
      cluster:
        description: "Target cluster"
        required: true
        type: string
      ocm_version:
        description: "Exact OCM component version to pin (e.g. ai-trust-main-abc123def456)"
        required: true
        type: string
      ref:
        description: "Git ref that triggered the build (used to select the GitHub environment)"
        required: false
        default: ""
        type: string
    secrets:
      GHCR_PULL_TOKEN:
        required: false

concurrency:
  group: bootstrap-gardener-${{ inputs.cluster }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # required for OIDC token exchange with Gardener shoot

jobs:
  bootstrap-main:
    name: Bootstrap (${{ inputs.cluster }})
    runs-on: ubuntu-latest
    # production environment only for main-branch deploys to ai-trust-main — these
    # are the only deployments that should appear in the GitHub Deployments view
    if: inputs.cluster == 'ai-trust-main' && (inputs.ref == 'refs/heads/main' || inputs.ref == 'main')
    environment: main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply to cluster
        uses: ./.github/actions/apply-to-cluster
        with:
          cluster: ${{ inputs.cluster }}
          ocm_version: ${{ inputs.ocm_version }}
          github_actor: ${{ github.actor }}
          ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
          app_admin_password: ${{ secrets.APP_ADMIN_PASSWORD }}
          clickhouse_password: ${{ secrets.CLICKHOUSE_PASSWORD }}
          keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          keycloak_client_secret: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          minio_root_password: ${{ secrets.MINIO_ROOT_PASSWORD }}
          oauth2_proxy_cookie_secret: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}
          postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          users_backend_client_secret: ${{ secrets.USERS_BACKEND_CLIENT_SECRET }}

  bootstrap-other:
    name: Bootstrap (${{ inputs.cluster }})
    runs-on: ubuntu-latest
    # all other deploys (sr-test cluster, or feature-branch manual runs to ai-trust-main)
    if: inputs.cluster != 'ai-trust-main' || (inputs.ref != 'refs/heads/main' && inputs.ref != 'main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply to cluster
        uses: ./.github/actions/apply-to-cluster
        with:
          cluster: ${{ inputs.cluster }}
          ocm_version: ${{ inputs.ocm_version }}
          github_actor: ${{ github.actor }}
          ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
          app_admin_password: ${{ secrets.APP_ADMIN_PASSWORD }}
          clickhouse_password: ${{ secrets.CLICKHOUSE_PASSWORD }}
          keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          keycloak_client_secret: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          minio_root_password: ${{ secrets.MINIO_ROOT_PASSWORD }}
          oauth2_proxy_cookie_secret: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}
          postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          users_backend_client_secret: ${{ secrets.USERS_BACKEND_CLIENT_SECRET }}
