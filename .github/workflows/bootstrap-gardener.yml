name: Bootstrap Gardener Cluster

# Runs the namespace/secret bootstrap and applies OCM CRs so the OCM controller
# + Flux can take over the actual Helm deployment. Called automatically by
# build-push.yml on every main merge, and can also be triggered manually.
#
# Prerequisites (one-time, per cluster):
#   bash k8s/gardener_init/shoot-cluster-init.sh <cluster-name>
#   (installs Traefik, OCM controller, Flux, certs, DNS)
#
# Required GitHub secret (gardener environment):
#   GHCR_PULL_TOKEN   - PAT with read:packages (only if ghcr.io packages are private)

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Target cluster"
        required: true
        default: ai-trust-main
        type: choice
        options:
          - ai-trust-main
          - sr-test
  workflow_call:
    inputs:
      cluster:
        description: "Target cluster"
        required: true
        type: string
    secrets:
      GHCR_PULL_TOKEN:
        required: false

concurrency:
  group: bootstrap-gardener-${{ inputs.cluster }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # required for OIDC token exchange with Gardener shoot

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: gardener
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load cluster env
        env:
          SECRET_APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          SECRET_CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          SECRET_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          SECRET_KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          SECRET_MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          SECRET_OAUTH2_PROXY_COOKIE_SECRET: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}
          SECRET_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          SECRET_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SECRET_USERS_BACKEND_CLIENT_SECRET: ${{ secrets.USERS_BACKEND_CLIENT_SECRET }}
        run: |
          ENV_FILE="k8s/env/${{ inputs.cluster }}/.env"
          if [[ ! -f "$ENV_FILE" ]]; then
            echo "error: $ENV_FILE not found — create it from k8s/env/ai-trust-main/.env" >&2
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          set +u
          _env_tmp=$(mktemp)
          tr -d '\r' < "$ENV_FILE" > "$_env_tmp"
          source "$_env_tmp"
          rm -f "$_env_tmp"
          set -u
          set +a
          APP_ADMIN_PASSWORD="$SECRET_APP_ADMIN_PASSWORD"
          CLICKHOUSE_PASSWORD="$SECRET_CLICKHOUSE_PASSWORD"
          KEYCLOAK_ADMIN_PASSWORD="$SECRET_KEYCLOAK_ADMIN_PASSWORD"
          KEYCLOAK_CLIENT_SECRET="$SECRET_KEYCLOAK_CLIENT_SECRET"
          MINIO_ROOT_PASSWORD="$SECRET_MINIO_ROOT_PASSWORD"
          OAUTH2_PROXY_COOKIE_SECRET="$SECRET_OAUTH2_PROXY_COOKIE_SECRET"
          POSTGRES_PASSWORD="$SECRET_POSTGRES_PASSWORD"
          RABBITMQ_PASSWORD="$SECRET_RABBITMQ_PASSWORD"
          SMTP_PASSWORD="$SECRET_SMTP_PASSWORD"
          USERS_BACKEND_CLIENT_SECRET="$SECRET_USERS_BACKEND_CLIENT_SECRET"
          while IFS='=' read -r key _; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            value=$(printenv "$key" 2>/dev/null || true)
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < <(tr -d '\r' < "$ENV_FILE" | grep -v '^\s*#' | grep -v '^\s*$')
          echo "NAMESPACE=${K8S_NAMESPACE:-ai-trust}" >> "$GITHUB_ENV"
          echo "Loaded env from $ENV_FILE"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Print Gardener OIDC vars
        run: |
          echo "cluster: ${{ inputs.cluster }}"
          echo "server: ${GARDENER_SHOOT_API_SERVER:-<unset>}"
          echo "server-ca-discovery-url: ${GARDENER_CA_DISCOVERY_URL:-<unset>}"
          echo "audience: ${GARDENER_OIDC_AUDIENCE:-<unset>}"

      - name: Authenticate to Gardener cluster via OIDC
        uses: gardener/cc-utils/.github/actions/kubernetes-auth@1e70b044f4d3305267a559e7ae74b4de57e1fdee
        with:
          server: ${{ env.GARDENER_SHOOT_API_SERVER }}
          server-ca-discovery-url: ${{ env.GARDENER_CA_DISCOVERY_URL }}
          audience: ${{ env.GARDENER_OIDC_AUDIENCE }}

      - name: Point KUBECONFIG at the authenticated kubeconfig
        run: echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Verify cluster connectivity
        run: kubectl get namespace default

      - name: Write .env for bootstrap.sh
        run: |
          umask 077
          cp "k8s/env/${{ inputs.cluster }}/.env" .env
          inject() {
            local key="$1" val="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              echo "${key}=${val}" >> .env
            fi
          }
          inject APP_ADMIN_PASSWORD          "$APP_ADMIN_PASSWORD"
          inject CLICKHOUSE_PASSWORD         "$CLICKHOUSE_PASSWORD"
          inject KEYCLOAK_ADMIN_PASSWORD     "$KEYCLOAK_ADMIN_PASSWORD"
          inject KEYCLOAK_CLIENT_SECRET      "$KEYCLOAK_CLIENT_SECRET"
          inject MINIO_ROOT_PASSWORD         "$MINIO_ROOT_PASSWORD"
          inject OAUTH2_PROXY_COOKIE_SECRET  "$OAUTH2_PROXY_COOKIE_SECRET"
          inject POSTGRES_PASSWORD           "$POSTGRES_PASSWORD"
          inject RABBITMQ_PASSWORD           "$RABBITMQ_PASSWORD"
          inject SMTP_PASSWORD               "$SMTP_PASSWORD"
          inject USERS_BACKEND_CLIENT_SECRET "$USERS_BACKEND_CLIENT_SECRET"

      - name: Bootstrap namespace/secrets/configmaps
        run: bash k8s/scripts/bootstrap.sh

      - name: Create ghcr.io pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [[ -z "$GHCR_PULL_TOKEN" ]]; then
            echo "GHCR_PULL_TOKEN not set - skipping (packages must be public)"
            exit 0
          fi
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ghcr-credentials secret in ocm-system
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create namespace ocm-system --dry-run=client -o yaml | kubectl apply -f -
          if [[ -z "$GHCR_PULL_TOKEN" ]]; then
            echo "GHCR_PULL_TOKEN not set - skipping (packages must be public)"
            exit 0
          fi
          kubectl create secret docker-registry ghcr-credentials \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            -n ocm-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply OCM component CRs
        run: kubectl apply -f k8s/ocm/
