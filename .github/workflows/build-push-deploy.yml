name: Deployment Workflow

# Builds every locally-built image and pushes to ghcr.io, packages the Helm chart,
# builds an OCM component, and deploys to a Gardener cluster.
#
# Automatic (push to main): deploys to ai-trust-main, namespace=ai-trust.
#
# Manual (workflow_dispatch): optional branch (default: main branch),
# gardener_cluster, and namespace inputs — useful for testing a feature branch
# against a non-production cluster before merging:
#   gh workflow run build-push-deploy.yml \
#     --ref <branch> \
#     -f branch=<branch> \
#     -f gardener_cluster=sr-test
#
# Produces a single "main-deployment" check run on the commit. Also seeds and
# finalises an "integration-tests" commit status so integration-tests.yml can
# overwrite it once the post-deployment test run completes.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (default: the branch this workflow runs on)"
        required: false
        default: ""
      gardener_cluster:
        description: "Gardener cluster to deploy to"
        required: false
        default: ai-trust-main
        type: choice
        options:
          - ai-trust-main
          - ai-trust-test
          - sr-test
          - none
      namespace:
        description: "Namespace to deploy into (derived from actor when blank)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.gardener_cluster || 'auto' }}-${{ inputs.namespace || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  statuses: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      tag: ${{ steps.vars.outputs.tag }}
      cluster: ${{ steps.vars.outputs.cluster }}
      namespace: ${{ steps.vars.outputs.namespace }}
      ref: ${{ steps.vars.outputs.ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve inputs
        id: inputs
        run: |
          # ref: explicit branch input wins, else the pushed commit SHA
          REF="${{ inputs.branch }}"
          echo "ref=${REF:-${{ github.sha }}}" >> "$GITHUB_OUTPUT"

          # cluster: explicit input wins (skip 'none'), else ai-trust-main
          CLUSTER="${{ inputs.gardener_cluster }}"
          if [[ -z "$CLUSTER" || "$CLUSTER" == "none" ]]; then
            CLUSTER="ai-trust-main"
          fi
          echo "cluster=${CLUSTER}" >> "$GITHUB_OUTPUT"

          # namespace: explicit input wins; ai-trust-main always uses ai-trust;
          # other clusters fall through to compute-vars (it defaults to github.actor)
          NS="${{ inputs.namespace }}"
          if [[ -z "$NS" && "$CLUSTER" == "ai-trust-main" ]]; then
            NS="ai-trust"
          fi
          echo "namespace=${NS}" >> "$GITHUB_OUTPUT"

      - name: Compute variables
        id: vars
        uses: ./.github/actions/compute-vars
        with:
          ref: ${{ steps.inputs.outputs.ref }}
          gardener_cluster: ${{ steps.inputs.outputs.cluster }}
          namespace: ${{ steps.inputs.outputs.namespace }}

  main-deployment:
    name: main-deployment
    needs: prepare
    runs-on: ubuntu-latest
    if: inputs.gardener_cluster != 'none'
    environment: ${{ needs.prepare.outputs.cluster == 'ai-trust-main' && 'main' || '' }}
    env:
      HEAD_SHA: ${{ needs.prepare.outputs.ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Seed pending integration-tests status
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${HEAD_SHA} \
            -f state=pending \
            -f context=integration-tests \
            -f description="Waiting for deployment to finish..." \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Build and push images
        uses: ./.github/actions/build-images
        with:
          owner: ${{ needs.prepare.outputs.owner }}
          tag: ${{ needs.prepare.outputs.tag }}
          vite_registry_api_base:   ${{ vars.VITE_REGISTRY_API_BASE || '/api/registry/v1' }}
          vite_users_api_base:      ${{ vars.VITE_USERS_API_BASE || '/api/users/v1' }}
          vite_monitoring_api_base: ${{ vars.VITE_MONITORING_API_BASE || '/api/monitoring/v1' }}
          vite_overview_api_base:   ${{ vars.VITE_OVERVIEW_API_BASE || '/api/overview/v1' }}
          vite_alerts_api_base:     ${{ vars.VITE_ALERTS_API_BASE || '/api/alerts/v1' }}
          vite_alerts_url:          ${{ vars.VITE_ALERTS_URL || 'http://localhost:8080/alerts' }}
          vite_registry_url:        ${{ vars.VITE_REGISTRY_URL || 'http://localhost:8080/registry' }}
          vite_compliance_url:      ${{ vars.VITE_COMPLIANCE_URL || 'http://localhost:8080/compliance' }}
          vite_compliance_api_base: ${{ vars.VITE_COMPLIANCE_API_BASE || '/api/compliance/v1' }}
          vite_dta_api_base:        ${{ vars.VITE_DTA_API_BASE || '/api/dta/v1' }}
          vite_audit_api_base:      ${{ vars.VITE_AUDIT_API_BASE || '/api/audit/v1' }}
          vite_admin_api_base:      ${{ vars.VITE_ADMIN_API_BASE || '/api/admin/v1' }}

      - name: Package and push Helm chart
        uses: ./.github/actions/package-chart
        with:
          owner: ${{ needs.prepare.outputs.owner }}
          tag: ${{ needs.prepare.outputs.tag }}

      - name: Build and push OCM component
        uses: ./.github/actions/publish-ocm
        with:
          owner: ${{ needs.prepare.outputs.owner }}
          tag: ${{ needs.prepare.outputs.tag }}

      - name: Deploy to cluster
        uses: ./.github/actions/apply-to-cluster
        with:
          cluster: ${{ needs.prepare.outputs.cluster }}
          ocm_version: ${{ needs.prepare.outputs.tag }}
          namespace: ${{ needs.prepare.outputs.namespace }}
          github_actor: ${{ github.actor }}
          ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
          app_admin_password: ${{ secrets.APP_ADMIN_PASSWORD }}
          clickhouse_password: ${{ secrets.CLICKHOUSE_PASSWORD }}
          keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          keycloak_client_secret: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          minio_root_password: ${{ secrets.MINIO_ROOT_PASSWORD }}
          oauth2_proxy_cookie_secret: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}
          postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          users_backend_client_secret: ${{ secrets.USERS_BACKEND_CLIENT_SECRET }}
          dev_user_password: ${{ secrets.DEV_USER_PASSWORD }}

      - name: Resolve integration-tests status on failed deploy
        if: failure() || cancelled()
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${HEAD_SHA} \
            -f state=error \
            -f context=integration-tests \
            -f description="Skipped — deployment did not succeed." \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
