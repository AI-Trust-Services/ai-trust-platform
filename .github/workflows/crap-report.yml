name: "CRAP Report"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  crap-report:
    name: "CRAP Report"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute CRAP scores for all components
        env:
          DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost/ci"
        run: |
          COMPONENTS=(
            admin/backend
            ai-system-registry/backend
            alerts/backend
            audit/backend
            audit-flush-worker
            compliance/backend
            consumers/clickhouse-consumer
            decision-trace-analyzer/backend
            document-indexing/backend
            document-indexing-worker
            embedding-service
            ai-test-bed/backend
            libs/authorization
            monitoring/backend
            otel-pipeline/rmq-bridge
            overview/backend
            policy-checker-worker
            users/backend
          )
          mkdir -p crap-reports
          FAILED=()

          # Start Job Summary
          {
            echo "# CRAP Report"
            echo ""
            echo "| Component | HIGH :red_circle: | MEDIUM :yellow_circle: | LOW :green_circle: | Status |"
            echo "|-----------|------------------:|----------------------:|-------------------:|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          for component in "${COMPONENTS[@]}"; do
            echo "::group::$component"
            slug="${component//\//-}"
            report="crap-reports/crap-report-${slug}.txt"

            if ! (cd "$component" && make setup 2>&1); then
              echo "✗ $component — setup failed, skipping CRAP" | tee "$report"
              FAILED+=("$component (setup)")
              echo "| \`$component\` | — | — | — | ✗ setup failed |" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi

            # Detect the source directory (app/ or the worker module root)
            if [ -d "$component/app" ]; then
              SRC="app"
            else
              SRC="."
            fi

            (
              cd "$component"
              echo "--- Branch coverage ---"
              .venv/bin/pytest tests/unit/ \
                --cov="$SRC" --cov-branch \
                --cov-report=json:coverage.json \
                --cov-report=term-missing -q 2>&1 || true

              echo ""
              echo "--- Cyclomatic complexity ---"
              .venv/bin/python3 -m radon cc "$SRC" --json > complexity.json 2>&1 || true

              echo ""
              echo "--- CRAP scores (functions scoring > 30) ---"
              python3 ../../scripts/crap_score.py \
                --coverage coverage.json \
                --complexity complexity.json \
                --threshold 30 2>&1 || true
            ) | tee "$report"

            high=$(grep -c "HIGH" "$report" || true)
            medium=$(grep -c "MEDIUM" "$report" || true)
            low=$(grep -c "LOW" "$report" || true)

            if [ "$high" -gt 0 ]; then
              status=":red_circle: needs attention"
            elif [ "$medium" -gt 0 ]; then
              status=":yellow_circle: review suggested"
            else
              status=":white_check_mark: ok"
            fi

            echo "| \`$component\` | $high | $medium | $low | $status |" >> "$GITHUB_STEP_SUMMARY"
            echo "✓ $component — report written to $report"
            echo "::endgroup::"
          done

          # Detail section: list all flagged functions grouped by component
          {
            echo ""
            echo "## Flagged Functions"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          any_flagged=0
          for report in crap-reports/*.txt; do
            slug=$(basename "$report" .txt | sed 's/^crap-report-//')
            component="${slug//-//}"
            flagged_lines=$(grep -E "HIGH|MEDIUM" "$report" 2>/dev/null || true)
            if [ -n "$flagged_lines" ]; then
              any_flagged=1
              {
                echo "<details>"
                echo "<summary><code>$component</code></summary>"
                echo ""
                echo '```'
                cat "$report"
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$any_flagged" -eq 0 ]; then
            echo "_No functions scored above threshold in any analysed component._" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Setup failures section
          if [ ${#FAILED[@]} -gt 0 ]; then
            {
              echo ""
              echo "## Setup Failures"
              echo ""
              echo "The following components could not be analysed (dependency install failed):"
              echo ""
              for f in "${FAILED[@]}"; do echo "- \`$f\`"; done
            } >> "$GITHUB_STEP_SUMMARY"

            echo ""
            echo "Components that could not be analysed (setup failure):"
            for f in "${FAILED[@]}"; do echo "  - $f"; done
          fi

      - name: Upload CRAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crap-reports
          path: crap-reports/
          retention-days: 30
