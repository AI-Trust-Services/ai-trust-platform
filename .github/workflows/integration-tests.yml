name: Integration Tests

# Two ways in:
#   1. workflow_run — automatic, after a successful deployment (the main path)
#        PR   — "PR Deployment Test" (garden-deploy label) → ai-trust-test / <pr-author>
#        main — "Deployment Workflow" (push to main)       → ai-trust-main  / ai-trust
#   2. workflow_dispatch — optional manual run / re-run against a live namespace,
#      no redeploy. Both inputs are defaulted, so it is one click.
#
# How the PR reporting works (the `integration-tests` commit status):
#   Results are published to ONE commit status context, `integration-tests`, which
#   is keyed by name and overwritten in place, so the PR shows a single entry that
#   transitions rather than a pile of separate results:
#
#     garden-deploy added  → pr-deployment-test.yml seeds it PENDING
#     deployment finishes  → this workflow overwrites it with success/failure
#
#   A commit status is used rather than a check run because workflow_run runs are
#   attached to the DEFAULT BRANCH, not the PR head, so their native checks never
#   appear on the PR at all. Same pattern as the `deploy-test` status in
#   pr-deployment-test.yml.
#
# Deliberately NO `pull_request:` trigger here. Every job in a pull_request-triggered
# workflow is pinned to the PR as its own check run, and `pull_request: [labeled]`
# fires for EVERY label (GitHub has no label-name filter in `on:`) — which left a
# permanently "Skipped" check plus a redundant seed-job check on the PR. The seeding
# is therefore a STEP inside pr-deployment-test.yml's existing job (steps create no
# check runs), and manual runs use workflow_dispatch.
#
# This workflow never gates the deployment — it reports its own status.
#
# EDITING THIS FILE: workflow_run does not just attach its runs to the default
# branch, it also RUNS THE DEFAULT BRANCH'S COPY of this file. Changes here
# therefore do nothing until they are merged to main — a branch cannot test them,
# and a run triggered from a PR will silently execute main's version instead.
# Validate the shell logic locally (it is plain bash; the runner is bash 5) and
# merge before expecting any behaviour change. The same applies to workflow_dispatch:
# the "Run workflow" button only appears once the trigger exists on main.
on:
  workflow_run:
    workflows:
      - "PR Deployment Test"
      - "Deployment Workflow"
    types:
      - completed
  # Optional on-demand run: re-test an already-deployed namespace without
  # redeploying. Both inputs have defaults, so "Run workflow" works with no edits.
  workflow_dispatch:
    inputs:
      gardener_cluster:
        description: "Cluster to test against"
        required: false
        default: ai-trust-test
        type: choice
        options:
          - ai-trust-test
          - ai-trust-main
      namespace:
        description: "Namespace to test (blank = ai-trust on ai-trust-main, else your username)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  statuses: write
  actions: read  # required to download artifacts from a different run (deployment-context)

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # workflow_run fires on completion regardless of outcome — only test a
    # deployment that actually succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Download deployment context (Deployment Workflow only)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deployment Workflow'
        uses: actions/download-artifact@v4
        with:
          name: deployment-context
          path: /tmp/deployment-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive cluster and namespace
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cluster="${{ inputs.gardener_cluster }}"
            cluster="${cluster:-ai-trust-test}"
            namespace="${{ inputs.namespace }}"
            if [[ -z "${namespace}" ]]; then
              if [[ "${cluster}" == "ai-trust-main" ]]; then
                namespace="ai-trust"
              else
                namespace="${GITHUB_ACTOR,,}"
              fi
            fi
            head_sha="${GITHUB_SHA}"
          else
            WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
            if [[ "${WORKFLOW_NAME}" == "Deployment Workflow" ]]; then
              # Read cluster/namespace/head_sha from the artifact uploaded by build-push-deploy.yml.
              # head_sha identifies the deployed commit — use it for checkout and commit status,
              # not workflow_run.head_sha which points to the workflow file's commit.
              cluster=$(cat /tmp/deployment-context/cluster 2>/dev/null | tr -d '[:space:]' || echo "ai-trust-main")
              namespace=$(cat /tmp/deployment-context/namespace 2>/dev/null | tr -d '[:space:]' || echo "ai-trust")
              head_sha=$(cat /tmp/deployment-context/head_sha 2>/dev/null | tr -d '[:space:]' || echo "${{ github.event.workflow_run.head_sha }}")
            else
              # PR Deployment Test — namespace is the PR author's login.
              PR_AUTHOR="${{ github.event.workflow_run.pull_requests[0].user.login }}"
              ACTOR="${{ github.event.workflow_run.actor.login }}"
              namespace="${PR_AUTHOR:-${ACTOR}}"
              cluster="ai-trust-test"
              head_sha="${{ github.event.workflow_run.head_sha }}"
            fi
          fi
          namespace="${namespace,,}"

          echo "cluster=${cluster}" >> "$GITHUB_OUTPUT"
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "==> cluster=${cluster}, namespace=${namespace}, head_sha=${head_sha}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.head_sha }}

      - name: Summary
        run: |
          echo "### Integration test variables" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| cluster | ${{ steps.vars.outputs.cluster }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| namespace | ${{ steps.vars.outputs.namespace }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| head_sha | ${{ steps.vars.outputs.head_sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| triggered_by | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"

      # Publishes an "integration-tests" status onto the triggering commit so the
      # result is visible on the PR (and on the main commit) instead of only in
      # the Actions tab.
      - name: Set pending commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.vars.outputs.head_sha }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${HEAD_SHA} \
            -f state=pending \
            -f context=integration-tests \
            -f description="Running against ${{ steps.vars.outputs.cluster }}/${{ steps.vars.outputs.namespace }}..." \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Load cluster env (API server, OIDC audience)
        shell: bash
        run: |
          ENV_FILE="k8s/env/${{ steps.vars.outputs.cluster }}/.env"
          if [[ ! -f "$ENV_FILE" ]]; then
            echo "error: $ENV_FILE not found" >&2
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          source <(grep -E '^(GARDENER_SHOOT_API_SERVER|GARDENER_CA_DISCOVERY_URL|GARDENER_OIDC_AUDIENCE)=' "$ENV_FILE")
          set +a
          echo "GARDENER_SHOOT_API_SERVER=${GARDENER_SHOOT_API_SERVER}" >> "$GITHUB_ENV"
          echo "GARDENER_CA_DISCOVERY_URL=${GARDENER_CA_DISCOVERY_URL}" >> "$GITHUB_ENV"
          echo "GARDENER_OIDC_AUDIENCE=${GARDENER_OIDC_AUDIENCE}" >> "$GITHUB_ENV"

      - name: Authenticate to Gardener cluster
        uses: gardener/cc-utils/.github/actions/kubernetes-auth@1e70b044f4d3305267a559e7ae74b4de57e1fdee
        with:
          server: ${{ env.GARDENER_SHOOT_API_SERVER }}
          server-ca-discovery-url: ${{ env.GARDENER_CA_DISCOVERY_URL }}
          audience: ${{ env.GARDENER_OIDC_AUDIENCE }}
          service-account-name: github-actions
          service-account-namespace: ocm-system
          service-account-token-expiration: 3600

      - name: Point KUBECONFIG at authenticated kubeconfig
        shell: bash
        run: echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Forward ports
        run: bash k8s/scripts/forward-ports.sh ${{ steps.vars.outputs.namespace }}

      - name: Run integration tests
        env:
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
        run: python3 -m pytest tests/integration/ -v

      - name: Stop port forwards
        if: always()
        run: bash k8s/scripts/kill-port-forwards.sh

      - name: Report final commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.vars.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "${JOB_STATUS}" in
            success) state=success; desc="All integration tests passed on the live deployment." ;;
            cancelled) state=error;   desc="Integration tests cancelled." ;;
            *)         state=failure; desc="Integration tests failed — see the run log." ;;
          esac

          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${HEAD_SHA} \
            -f state="${state}" \
            -f context=integration-tests \
            -f description="${desc}" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
