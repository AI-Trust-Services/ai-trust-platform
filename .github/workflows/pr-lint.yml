name: "Pre-merge check: lint"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: "Pre-merge check: lint"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.9.10

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .
