name: Apply to Cluster
description: Bootstrap a Gardener shoot cluster and wait for the Flux HelmRelease to reach the target OCM version.

inputs:
  cluster:
    description: "Target cluster name (must match a directory under k8s/env/)"
    required: true
  ocm_version:
    description: "Exact OCM component version to pin (e.g. ai-trust-main-abc123def456)"
    required: true
  github_actor:
    description: "GitHub actor for ghcr.io pull secret (pass github.actor)"
    required: true
  ghcr_pull_token:
    description: "PAT with read:packages for ghcr.io (optional — skip if packages are public)"
    required: false
    default: ""
  app_admin_password:
    description: "APP_ADMIN_PASSWORD secret"
    required: true
  clickhouse_password:
    description: "CLICKHOUSE_PASSWORD secret"
    required: true
  keycloak_admin_password:
    description: "KEYCLOAK_ADMIN_PASSWORD secret"
    required: true
  keycloak_client_secret:
    description: "KEYCLOAK_CLIENT_SECRET secret"
    required: true
  minio_root_password:
    description: "MINIO_ROOT_PASSWORD secret"
    required: true
  oauth2_proxy_cookie_secret:
    description: "OAUTH2_PROXY_COOKIE_SECRET secret"
    required: true
  postgres_password:
    description: "POSTGRES_PASSWORD secret"
    required: true
  rabbitmq_password:
    description: "RABBITMQ_PASSWORD secret"
    required: true
  smtp_password:
    description: "SMTP_PASSWORD secret"
    required: true
  users_backend_client_secret:
    description: "USERS_BACKEND_CLIENT_SECRET secret"
    required: true

runs:
  using: composite
  steps:
    - name: Load cluster env
      shell: bash
      env:
        SECRET_APP_ADMIN_PASSWORD: ${{ inputs.app_admin_password }}
        SECRET_CLICKHOUSE_PASSWORD: ${{ inputs.clickhouse_password }}
        SECRET_KEYCLOAK_ADMIN_PASSWORD: ${{ inputs.keycloak_admin_password }}
        SECRET_KEYCLOAK_CLIENT_SECRET: ${{ inputs.keycloak_client_secret }}
        SECRET_MINIO_ROOT_PASSWORD: ${{ inputs.minio_root_password }}
        SECRET_OAUTH2_PROXY_COOKIE_SECRET: ${{ inputs.oauth2_proxy_cookie_secret }}
        SECRET_POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        SECRET_RABBITMQ_PASSWORD: ${{ inputs.rabbitmq_password }}
        SECRET_SMTP_PASSWORD: ${{ inputs.smtp_password }}
        SECRET_USERS_BACKEND_CLIENT_SECRET: ${{ inputs.users_backend_client_secret }}
      run: |
        ENV_FILE="k8s/env/${{ inputs.cluster }}/.env"
        if [[ ! -f "$ENV_FILE" ]]; then
          echo "error: $ENV_FILE not found — create it from k8s/env/ai-trust-main/.env" >&2
          exit 1
        fi
        set -a
        # shellcheck disable=SC1090
        set +u
        _env_tmp=$(mktemp)
        tr -d '\r' < "$ENV_FILE" > "$_env_tmp"
        source "$_env_tmp"
        rm -f "$_env_tmp"
        set -u
        set +a
        APP_ADMIN_PASSWORD="$SECRET_APP_ADMIN_PASSWORD"
        CLICKHOUSE_PASSWORD="$SECRET_CLICKHOUSE_PASSWORD"
        KEYCLOAK_ADMIN_PASSWORD="$SECRET_KEYCLOAK_ADMIN_PASSWORD"
        KEYCLOAK_CLIENT_SECRET="$SECRET_KEYCLOAK_CLIENT_SECRET"
        MINIO_ROOT_PASSWORD="$SECRET_MINIO_ROOT_PASSWORD"
        OAUTH2_PROXY_COOKIE_SECRET="$SECRET_OAUTH2_PROXY_COOKIE_SECRET"
        POSTGRES_PASSWORD="$SECRET_POSTGRES_PASSWORD"
        RABBITMQ_PASSWORD="$SECRET_RABBITMQ_PASSWORD"
        SMTP_PASSWORD="$SECRET_SMTP_PASSWORD"
        USERS_BACKEND_CLIENT_SECRET="$SECRET_USERS_BACKEND_CLIENT_SECRET"
        while IFS='=' read -r key _; do
          [[ -z "$key" || "$key" == \#* ]] && continue
          value=$(printenv "$key" 2>/dev/null || true)
          echo "${key}=${value}" >> "$GITHUB_ENV"
        done < <(tr -d '\r' < "$ENV_FILE" | grep -v '^\s*#' | grep -v '^\s*$')
        echo "NAMESPACE=${K8S_NAMESPACE:-ai-trust}" >> "$GITHUB_ENV"
        echo "Loaded env from $ENV_FILE"

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4

    - name: Print Gardener OIDC vars
      shell: bash
      run: |
        echo "cluster: ${{ inputs.cluster }}"
        echo "server: ${GARDENER_SHOOT_API_SERVER:-<unset>}"
        echo "server-ca-discovery-url: ${GARDENER_CA_DISCOVERY_URL:-<unset>}"
        echo "audience: ${GARDENER_OIDC_AUDIENCE:-<unset>}"

    - name: Authenticate to Gardener cluster via OIDC
      uses: gardener/cc-utils/.github/actions/kubernetes-auth@1e70b044f4d3305267a559e7ae74b4de57e1fdee
      with:
        server: ${{ env.GARDENER_SHOOT_API_SERVER }}
        server-ca-discovery-url: ${{ env.GARDENER_CA_DISCOVERY_URL }}
        audience: ${{ env.GARDENER_OIDC_AUDIENCE }}

    - name: Point KUBECONFIG at the authenticated kubeconfig
      shell: bash
      run: echo "KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig.yaml" >> "$GITHUB_ENV"

    - name: Verify cluster connectivity
      shell: bash
      run: kubectl get namespace default

    - name: Write .env for bootstrap.sh
      shell: bash
      run: |
        umask 077
        cp "k8s/env/${{ inputs.cluster }}/.env" .env
        inject() {
          local key="$1" val="$2"
          if grep -q "^${key}=" .env; then
            sed -i "s|^${key}=.*|${key}=${val}|" .env
          else
            echo "${key}=${val}" >> .env
          fi
        }
        inject APP_ADMIN_PASSWORD          "$APP_ADMIN_PASSWORD"
        inject CLICKHOUSE_PASSWORD         "$CLICKHOUSE_PASSWORD"
        inject KEYCLOAK_ADMIN_PASSWORD     "$KEYCLOAK_ADMIN_PASSWORD"
        inject KEYCLOAK_CLIENT_SECRET      "$KEYCLOAK_CLIENT_SECRET"
        inject MINIO_ROOT_PASSWORD         "$MINIO_ROOT_PASSWORD"
        inject OAUTH2_PROXY_COOKIE_SECRET  "$OAUTH2_PROXY_COOKIE_SECRET"
        inject POSTGRES_PASSWORD           "$POSTGRES_PASSWORD"
        inject RABBITMQ_PASSWORD           "$RABBITMQ_PASSWORD"
        inject SMTP_PASSWORD               "$SMTP_PASSWORD"
        inject USERS_BACKEND_CLIENT_SECRET "$USERS_BACKEND_CLIENT_SECRET"

    - name: Bootstrap namespace/secrets/configmaps
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.ocm_version }}
      run: bash k8s/scripts/bootstrap.sh

    - name: Create ghcr.io pull secret
      shell: bash
      env:
        GHCR_PULL_TOKEN: ${{ inputs.ghcr_pull_token }}
      run: |
        if [[ -z "$GHCR_PULL_TOKEN" ]]; then
          echo "GHCR_PULL_TOKEN not set - skipping (packages must be public)"
          exit 0
        fi
        kubectl create secret docker-registry ghcr-pull-secret \
          --docker-server=ghcr.io \
          --docker-username="${{ inputs.github_actor }}" \
          --docker-password="$GHCR_PULL_TOKEN" \
          -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

    - name: Create ghcr-credentials secret in ocm-system
      shell: bash
      env:
        GHCR_PULL_TOKEN: ${{ inputs.ghcr_pull_token }}
      run: |
        kubectl create namespace ocm-system --dry-run=client -o yaml | kubectl apply -f -
        if [[ -z "$GHCR_PULL_TOKEN" ]]; then
          echo "GHCR_PULL_TOKEN not set - skipping (packages must be public)"
          exit 0
        fi
        kubectl create secret docker-registry ghcr-credentials \
          --docker-server=ghcr.io \
          --docker-username="${{ inputs.github_actor }}" \
          --docker-password="$GHCR_PULL_TOKEN" \
          -n ocm-system --dry-run=client -o yaml | kubectl apply -f -

    - name: Apply OCM component CRs
      shell: bash
      env:
        OCM_VERSION: 0.0.0-${{ inputs.ocm_version }}
      run: |
        if [[ -z "${{ inputs.ocm_version }}" ]]; then
          echo "error: ocm_version input is required to pin the ComponentVersion" >&2
          exit 1
        fi
        envsubst '${OCM_VERSION}' < k8s/ocm/manifests.yaml | kubectl apply -f -
        echo "Applied OCM CRs with ComponentVersion pinned to ${OCM_VERSION}"

    - name: Wait for HelmRelease upgrade
      shell: bash
      env:
        EXPECTED_VERSION: ${{ inputs.ocm_version }}
      run: |
        TIMEOUT=900    # 15 minutes
        INTERVAL=60
        ELAPSED=0
        echo "Waiting for HelmRelease ai-trust-platform in namespace ocm-system to reach version ${EXPECTED_VERSION}..."
        while true; do
          HR=$(kubectl get helmrelease ai-trust-platform -n ocm-system -o json 2>/tmp/hr_err) || true
          if [[ -s /tmp/hr_err ]]; then
            echo "[${ELAPSED}s] kubectl error: $(cat /tmp/hr_err)"
          fi
          if [[ -z "$HR" ]]; then
            echo "[${ELAPSED}s] HelmRelease not yet created — waiting..."
          else
            READY_STATUS=$(echo "$HR" | jq -r '.status.conditions[]? | select(.type=="Ready") | .status' 2>/dev/null || echo "")
            READY_REASON=$(echo "$HR" | jq -r '.status.conditions[]? | select(.type=="Ready") | .reason' 2>/dev/null || echo "")
            READY_MSG=$(echo "$HR" | jq -r '.status.conditions[]? | select(.type=="Ready") | .message' 2>/dev/null || echo "")
            LAST_APPLIED=$(echo "$HR" | jq -r '.status.lastAppliedRevision // ""' 2>/dev/null || echo "")
            echo "[${ELAPSED}s] Ready=${READY_STATUS} reason=${READY_REASON} lastAppliedRevision=${LAST_APPLIED}"
            [[ -n "$READY_MSG" ]] && echo "         message: ${READY_MSG}"
            # Fail fast on terminal error states
            case "$READY_REASON" in
              InstallFailed|UpgradeFailed|RollbackFailed|UninstallFailed|TestFailed)
                echo "error: HelmRelease failed with reason=${READY_REASON}" >&2
                echo "Full status conditions:" >&2
                echo "$HR" | jq '.status.conditions' >&2
                exit 1
                ;;
            esac
            # Succeed when Ready=True and the applied revision contains the expected version
            if [[ "$READY_STATUS" == "True" ]]; then
              if echo "$LAST_APPLIED" | grep -qF "${EXPECTED_VERSION}"; then
                echo "HelmRelease is ready at version ${LAST_APPLIED} — deploy succeeded."
                exit 0
              else
                echo "[${ELAPSED}s] Ready=True but lastAppliedRevision=${LAST_APPLIED} does not yet contain ${EXPECTED_VERSION} — still waiting..."
              fi
            fi
          fi
          if (( ELAPSED >= TIMEOUT )); then
            echo "error: timed out after ${TIMEOUT}s waiting for HelmRelease to reach version ${EXPECTED_VERSION}" >&2
            echo "Last known HelmRelease status:" >&2
            kubectl get helmrelease ai-trust-platform -n ocm-system -o yaml >&2 || true
            exit 1
          fi
          sleep "$INTERVAL"
          ELAPSED=$(( ELAPSED + INTERVAL ))
        done
