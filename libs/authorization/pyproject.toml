[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trust-authorization"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openfga-sdk==0.10.4", "fastapi>=0.115"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_trust_authorization*"]
