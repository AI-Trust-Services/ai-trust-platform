[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trust-persistence"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "greenlet",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_trust_persistence*"]
