[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trust-persistence"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "greenlet",
    "pgvector",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_trust_persistence*"]
