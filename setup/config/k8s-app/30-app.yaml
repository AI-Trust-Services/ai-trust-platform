---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-system-registry-backend, namespace: ai-trust-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: ai-system-registry-backend } }
  template:
    metadata: { labels: { app: ai-system-registry-backend } }
    spec:
      containers:
        - name: ai-system-registry-backend
          image: aitrust/ai-system-registry-backend:kind
          imagePullPolicy: Always
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL } } }
            - { name: ALLOWED_ORIGINS, valueFrom: { configMapKeyRef: { name: app-config, key: ALLOWED_ORIGINS } } }
            - { name: ROOT_PATH, value: "/api/registry" }
          ports: [{ containerPort: 8001 }]
          readinessProbe:
            exec: { command: ["python","healthcheck.py"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: { name: ai-system-registry-backend, namespace: ai-trust-app }
spec: { selector: { app: ai-system-registry-backend }, ports: [{ port: 8001, targetPort: 8001 }] }
