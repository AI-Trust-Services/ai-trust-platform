# Overlay for deploying to a real Gardener shoot cluster via
# .github/workflows/deploy-gardener.yml. Applied on top of values.yaml with
# `helm upgrade --install -f values.yaml -f values-gardener.yaml`.
#
# Values that depend on the specific environment (image.repository/tag,
# appPublicUrl, keycloakPublicUrl, ingress.host, ingress.keycloakHost,
# imagePullSecrets) are NOT set here - the workflow passes them via --set from
# repo variables/secrets, since they differ per repo/cluster and (for the
# image tag) per run. See k8s/README.md for the full list.

image:
  pullPolicy: IfNotPresent

oauthProxy:
  serviceType: ClusterIP # reached via the Ingress below instead of a NodePort
  cookieSecure: false # no TLS termination in front of it

keycloak:
  serviceType: ClusterIP # reached via the Ingress below instead of a NodePort

ingress:
  enabled: true
  className: traefik
  tls:
    enabled: false
    selfSigned: false
  annotations: {}
