# Overlay for deploying to a real Gardener shoot cluster via
# .github/workflows/deploy-gardener.yml. Applied on top of values.yaml with
# `helm upgrade --install -f values.yaml -f values-gardener.yaml`.
#
# Values that depend on the specific environment (image.repository/tag,
# appPublicUrl, keycloakPublicUrl, ingress.host, ingress.keycloakHost,
# imagePullSecrets) are NOT set here - the workflow passes them via --set from
# repo variables/secrets, since they differ per repo/cluster and (for the
# image tag) per run. See k8s/README.md for the full list.

image:
  pullPolicy: IfNotPresent

oauthProxy:
  serviceType: ClusterIP # reached via the Ingress below instead of a NodePort
  # cookieSecure is intentionally false: TLS termination is not yet configured.
  # This deployment carries no sensitive production data — it is a dev/demo
  # environment. TLS via cert-manager + letsencrypt-prod (ClusterIssuer in
  # k8s/gardener_init/cert-manager-issuer.yaml) is the intended end-state;
  # set cookieSecure: true and enable ingress.tls once DNS and certs are in place.
  cookieSecure: false

keycloak:
  serviceType: ClusterIP # reached via the Ingress below instead of a NodePort

ingress:
  enabled: true
  className: traefik
  tls:
    # TLS disabled — plain HTTP only. No sensitive production data is in transit.
    # To enable: set enabled: true, ensure ingress.tls.secretName is set in
    # values.yaml (currently "ai-trust-tls"), and add the annotation:
    #   cert-manager.io/cluster-issuer: letsencrypt-prod
    # cert-manager + ClusterIssuer are already provisioned via k8s/gardener_init/.
    enabled: false
    selfSigned: false
  annotations: {}
