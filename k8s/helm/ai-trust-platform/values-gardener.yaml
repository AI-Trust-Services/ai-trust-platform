# Overlay for deploying to a real Gardener shoot cluster via
# .github/workflows/deploy-gardener.yml. Applied on top of values.yaml with
# `helm upgrade --install -f values.yaml -f values-gardener.yaml`.
#
# All infra services (postgres, rabbitmq, clickhouse, minio, otel, ollama) default
# to ClusterIP in values.yaml, so no serviceType overrides are needed here.
# Only oauth2-proxy and keycloak need explicit settings because they also configure
# cookieSecure and are reached via the Ingress instead of a NodePort.
#
# Values that depend on the specific environment (image.repository/tag,
# appPublicUrl, keycloakPublicUrl, ingress.host, ingress.keycloakHost,
# imagePullSecrets) are NOT set here - the workflow passes them via --set from
# repo variables/secrets, since they differ per repo/cluster and (for the
# image tag) per run. See k8s/README.md for the full list.

image:
  pullPolicy: IfNotPresent

oauthProxy:
  cookieSecure: true

ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    selfSigned: false
  annotations:
    # LLM-backed endpoints (AI classification, document extraction) can take 2-3 min
    # on Ollama. Traefik's default respondingTimeout is 60s — attach a Middleware that
    # raises the forwarding timeout so the connection isn't cut mid-inference.
    # The Middleware is defined in templates/traefik-timeout-middleware.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: "ai-trust-llm-timeout@kubernetescrd"

