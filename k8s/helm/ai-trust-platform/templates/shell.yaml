{{/* Pure nginx reverse proxy - no runtime env, no hard dependency: it returns a
     transient 502 for any upstream that isn't ready yet and self-heals once it is
     (same as it does today in docker-compose), so no wait initContainers here. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "shell") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "shell") | nindent 8 }}
    spec:
      {{- include "ai-trust.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: shell
          image: {{ .Values.image.repository }}/shell:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shell
spec:
  selector:
    {{- include "ai-trust.labels" (dict "name" "shell") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
