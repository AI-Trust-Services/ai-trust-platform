{{- if .Values.cogneeEval.enabled }}
{{/* Cognee eval backend — graph-based grounded Q&A over the EU AI Act. */}}
{{- if and .Values.cogneeEval.readOnly (not (regexMatch "@sha256:[a-fA-F0-9]{64}$" (.Values.cogneeEval.graphImage | default ""))) }}
{{- fail "cogneeEval.readOnly=true requires cogneeEval.graphImage pinned by sha256 digest" }}
{{- end }}
{{- if .Values.cogneeEval.readOnly }}
{{/* Read-only production: frozen graph snapshot hydrated into an emptyDir by an
     init container; COGNEE_READONLY gates off ingest/feedback. No PVC — the pod
     is stateless and reconstructs the exact pinned graph on every start. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee-eval-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "cognee-eval-backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "cognee-eval-backend") | nindent 8 }}
    spec:
      {{- include "ai-trust.imagePullSecrets" $ | nindent 6 }}
      initContainers:
        - name: hydrate-graph
          image: {{ .Values.cogneeEval.graphImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["tar", "xzf", "/graph.tar.gz", "-C", "/app/.cognee_system"]
          volumeMounts:
            - name: data
              mountPath: /app/.cognee_system
      containers:
        - name: cognee-eval-backend
          image: {{ .Values.image.repository }}/cognee-eval-backend:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          env:
            - name: COGNEE_READONLY
              value: "true"
            - name: ALLOWED_ORIGINS
              value: {{ .Values.appPublicUrl | quote }}
            # Thalamus (THALAMUS_BASE_URL / THALAMUS_MODEL / THALAMUS_BEARER_TOKEN)
            # is read directly from the ai-trust-env Secret via envFrom above.
          ports:
            - containerPort: {{ .Values.cogneeEval.backendPort }}
          volumeMounts:
            - name: data
              mountPath: /app/.cognee_system
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.cogneeEval.backendPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.cogneeEval.backendPort }}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.cogneeEval.dataStorageSize }}
{{- else }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cognee-eval-backend
spec:
  serviceName: cognee-eval-backend
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "cognee-eval-backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "cognee-eval-backend") | nindent 8 }}
    spec:
      {{- include "ai-trust.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: cognee-eval-backend
          image: {{ .Values.image.repository }}/cognee-eval-backend:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          env:
            - name: ALLOWED_ORIGINS
              value: {{ .Values.appPublicUrl | quote }}
            # Thalamus (THALAMUS_BASE_URL / THALAMUS_MODEL / THALAMUS_BEARER_TOKEN)
            # is read directly from the ai-trust-env Secret via envFrom above.
          ports:
            - containerPort: {{ .Values.cogneeEval.backendPort }}
          volumeMounts:
            - name: data
              mountPath: /app/.cognee_system
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.cogneeEval.backendPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          # Ingestion is synchronous and blocks the asyncio event loop for minutes
          # (entity extraction + node/edge merge for a full document), so /health
          # cannot answer promptly during a large ingest. Keep the liveness probe
          # tolerant enough that a long ingest is never mistaken for a hung pod.
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.cogneeEval.backendPort }}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.cogneeEval.dataStorageSize }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cognee-eval-backend
spec:
  selector:
    {{- include "ai-trust.labels" (dict "name" "cognee-eval-backend") | nindent 4 }}
  ports:
    - port: {{ .Values.cogneeEval.backendPort }}
      targetPort: {{ .Values.cogneeEval.backendPort }}
{{- end }}
