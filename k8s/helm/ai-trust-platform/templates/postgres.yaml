apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate # required for a ReadWriteOnce PVC
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          env:
            - name: POSTGRES_DB
              value: ai_trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init.sh
              subPath: init.sh
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-script
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: {{ .Values.postgres.serviceType | default "ClusterIP" }}
  selector:
    {{- include "ai-trust.labels" (dict "name" "postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
      {{- if ne (.Values.postgres.serviceType | default "ClusterIP") "ClusterIP" }}
      nodePort: {{ .Values.postgres.nodePort }}
      {{- end }}
