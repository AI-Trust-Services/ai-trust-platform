apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "rabbitmq") | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: RABBITMQ_PASSWORD } }
          ports:
            - containerPort: 5672
            - containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  type: {{ .Values.rabbitmq.serviceType | default "ClusterIP" }}
  selector:
    {{- include "ai-trust.labels" (dict "name" "rabbitmq") | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
      {{- if ne (.Values.rabbitmq.serviceType | default "ClusterIP") "ClusterIP" }}
      nodePort: {{ .Values.rabbitmq.nodePort }}
      {{- end }}
