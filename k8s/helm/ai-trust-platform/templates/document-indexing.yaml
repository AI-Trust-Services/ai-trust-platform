{{/* Document indexing feature: a shared BGE-M3 embedding server, the indexing API
     backend, and the async indexing worker. Deployed on k8s/kind only (this feature
     has no docker-compose entry). The worker's queue is the DB (document_versions.status),
     so no broker is involved. */}}

{{/* ── embedding-service: loads EMBED_MODEL once, shared by backend (query) + worker (index) ── */}}
{{/* Converted from StatefulSet to Deployment with a standalone RWX PVC so the service can
     run multiple replicas across nodes. The HuggingFace model cache (~2 GB) is shared via
     the PVC; concurrent reads are safe (files are immutable once downloaded). If upgrading
     from a prior StatefulSet install, delete the orphaned PVC after the upgrade:
       kubectl delete pvc hf-cache-embedding-service-0 -n <namespace>
     The model will re-download on first start (initialDelaySeconds: 300 accounts for this). */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedding-service-hf-cache
spec:
  accessModes: ["ReadWriteMany"]
  {{- if .Values.indexing.embedding.storageClassName }}
  storageClassName: {{ .Values.indexing.embedding.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.indexing.embedding.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "embedding-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "embedding-service") | nindent 8 }}
    spec:
      {{- include "ai-trust.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: embedding-service
          image: {{ .Values.image.repository }}/embedding-service:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: EMBED_MODEL
              value: {{ .Values.indexing.embedModel | quote }}
          ports:
            - containerPort: {{ .Values.indexing.embedding.port }}
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          # Model load is slow (first start also downloads ~2 GB) — /health returns
          # 503 until it is in memory, so give readiness a long grace window.
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.indexing.embedding.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.indexing.embedding.port }}
            initialDelaySeconds: 300
            periodSeconds: 30
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: embedding-service-hf-cache
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
spec:
  type: {{ .Values.indexing.embedding.serviceType | default "ClusterIP" }}
  selector:
    {{- include "ai-trust.labels" (dict "name" "embedding-service") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.indexing.embedding.port }}
      targetPort: {{ .Values.indexing.embedding.port }}
---
{{/* ── document-indexing-backend: upload, status, retrieval API ── */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-indexing-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "document-indexing-backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "document-indexing-backend") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.jobWaiter }}
      {{- include "ai-trust.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "ai-trust.waitForJob" (dict "job" "db-migrate" "rev" .Release.Revision "image" .Values.waitImages.kubectl) | nindent 8 }}
        {{- include "ai-trust.waitForJob" (dict "job" "openfga-provision" "rev" .Release.Revision "image" .Values.waitImages.kubectl) | nindent 8 }}
        {{- include "ai-trust.waitForHttp" (dict "name" "minio" "port" 9000 "path" "/minio/health/live" "image" .Values.waitImages.busybox) | nindent 8 }}
        {{- include "ai-trust.waitForHttp" (dict "name" "embedding-service" "port" .Values.indexing.embedding.port "path" "/health" "image" .Values.waitImages.busybox) | nindent 8 }}
      containers:
        - name: document-indexing-backend
          image: {{ .Values.image.repository }}/document-indexing-backend:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} } # DATABASE_URL, MINIO_*
          env:
            - name: ALLOWED_ORIGINS
              value: {{ .Values.appPublicUrl | quote }}
            - name: ROOT_PATH
              value: {{ .Values.indexing.rootPath | quote }}
            - name: INDEXING_BUCKET
              value: {{ .Values.indexing.bucket | quote }}
            - name: EMBEDDING_SERVICE_URL
              value: http://embedding-service:{{ .Values.indexing.embedding.port }}
            - name: OPENFGA_URL
              value: http://openfga:8080
          ports:
            - containerPort: {{ .Values.indexing.backendPort }}
          volumeMounts:
            - name: openfga-config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.indexing.backendPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.indexing.backendPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: openfga-config
          secret:
            secretName: openfga-store-id
            items:
              - key: store_id
                path: store_id
---
apiVersion: v1
kind: Service
metadata:
  name: document-indexing-backend
spec:
  selector:
    {{- include "ai-trust.labels" (dict "name" "document-indexing-backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.indexing.backendPort }}
      targetPort: {{ .Values.indexing.backendPort }}
---
{{/* ── document-indexing-worker: DB-polling indexer (no HTTP port) ── */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-indexing-worker
spec:
  # Single-writer by design: the worker polls document_versions.status and processes
  # one document at a time. Multiple replicas would race on the same rows causing
  # duplicate processing. Distributed locking is out of scope for this issue.
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "document-indexing-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "document-indexing-worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.jobWaiter }}
      {{- include "ai-trust.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "ai-trust.waitForJob" (dict "job" "db-migrate" "rev" .Release.Revision "image" .Values.waitImages.kubectl) | nindent 8 }}
        {{- include "ai-trust.waitForHttp" (dict "name" "minio" "port" 9000 "path" "/minio/health/live" "image" .Values.waitImages.busybox) | nindent 8 }}
      containers:
        - name: document-indexing-worker
          image: {{ .Values.image.repository }}/document-indexing-worker:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} } # DATABASE_URL, MINIO_*
          env:
            - name: INDEXING_BUCKET
              value: {{ .Values.indexing.bucket | quote }}
            - name: INDEXING_POLL_INTERVAL
              value: {{ .Values.indexing.pollInterval | quote }}
            - name: EMBED_MODEL
              value: {{ .Values.indexing.embedModel | quote }}
            - name: EMBEDDING_SERVICE_URL
              value: http://embedding-service:{{ .Values.indexing.embedding.port }}

