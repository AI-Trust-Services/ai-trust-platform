{{/* The 7 near-identical backend+frontend MFE pairs (see values.yaml `components`).
     Mirrors the structurally-identical "Backend stacks"/"Frontend stacks" pattern
     already described in CLAUDE.md - one ranged template instead of 14 near-duplicate files. */}}
{{- range $c := .Values.components }}
{{- $backend := printf "%s-backend" $c.name }}
{{- $frontend := printf "%s-frontend" $c.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $backend }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" $backend) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" $backend) | nindent 8 }}
    spec:
      {{- include "ai-trust.imagePullSecrets" $ | nindent 6 }}
      {{- if gt (len $c.dependsOnJobs) 0 }}
      serviceAccountName: {{ $.Values.serviceAccount.jobWaiter }}
      {{- end }}
      {{- if or (gt (len $c.dependsOnJobs) 0) (gt (len $c.dependsOnServices) 0) }}
      initContainers:
        {{- range $job := $c.dependsOnJobs }}
        {{- include "ai-trust.waitForJob" (dict "job" $job "image" $.Values.waitImages.kubectl) | nindent 8 }}
        {{- end }}
        {{- range $svc := $c.dependsOnServices }}
        {{- include "ai-trust.waitForHttp" (dict "name" $svc.name "port" $svc.port "path" $svc.httpPath "image" $.Values.waitImages.busybox) | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $backend }}
          image: {{ $.Values.image.repository }}/{{ $backend }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: {{ $.Values.secretName }} }
          env:
            - name: ALLOWED_ORIGINS
              value: {{ $.Values.appPublicUrl | quote }}
            - name: ROOT_PATH
              value: {{ $c.rootPath | quote }}
            {{- range $k, $v := $c.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $c.backendPort }}
          {{- if $c.openfgaConfig }}
          volumeMounts:
            - name: openfga-config
              mountPath: /config
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $c.backendPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $c.backendPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
      {{- if $c.openfgaConfig }}
      volumes:
        - name: openfga-config
          persistentVolumeClaim:
            claimName: openfga-config
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $backend }}
spec:
  selector:
    {{- include "ai-trust.labels" (dict "name" $backend) | nindent 4 }}
  ports:
    - port: {{ $c.backendPort }}
      targetPort: {{ $c.backendPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $frontend }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" $frontend) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" $frontend) | nindent 8 }}
    spec:
      {{- include "ai-trust.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: {{ $frontend }}
          image: {{ $.Values.image.repository }}/{{ $frontend }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $frontend }}
spec:
  selector:
    {{- include "ai-trust.labels" (dict "name" $frontend) | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
{{- end }}
