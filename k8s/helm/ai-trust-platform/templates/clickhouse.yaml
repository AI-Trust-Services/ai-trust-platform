apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.clickhouse.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  strategy:
    type: Recreate # required for a ReadWriteOnce PVC
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "clickhouse") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.jobWaiter }}
      securityContext:
        fsGroup: 101 # clickhouse/clickhouse-server:24.5-alpine runs as uid/gid 101
      initContainers:
        # fixes crash-loop (exit 243 MISMATCHING_USERS_FOR_PROCESS_AND_DATA) when the PVC
        # already has data from a prior run owned by a different uid - only bites on reuse,
        # but always safe to run.
        - name: fix-perms
          image: {{ .Values.waitImages.busybox }}
          command: ["sh", "-c", "chown -R 101:101 /var/lib/clickhouse"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
        # mirrors compose: clickhouse depends_on minio-init (service_completed_successfully)
        {{- include "ai-trust.waitForJob" (dict "job" "minio-init" "image" .Values.waitImages.kubectl) | nindent 8 }}
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} } # CLICKHOUSE_USER/PASSWORD + MINIO_ROOT_USER/PASSWORD (for the S3 disk)
          ports:
            - containerPort: 8123
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "clickhouse-client --user \"$CLICKHOUSE_USER\" --password \"$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "clickhouse-client --user \"$CLICKHOUSE_USER\" --password \"$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clickhouse-data
        - name: config
          configMap:
            name: clickhouse-config
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  type: {{ .Values.clickhouse.serviceType | default "NodePort" }}
  selector:
    {{- include "ai-trust.labels" (dict "name" "clickhouse") | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      {{- if ne (.Values.clickhouse.serviceType | default "NodePort") "ClusterIP" }}
      nodePort: {{ .Values.clickhouse.nodePort }}
      {{- end }}
    - name: native
      port: 9000
      targetPort: 9000
