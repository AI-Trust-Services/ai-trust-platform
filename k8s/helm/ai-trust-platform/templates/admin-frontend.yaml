{{/* Admin portal - frontend-only MFE (no backend), platform administration UI.
     Served via shell nginx at /admin/. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-trust.labels" (dict "name" "admin-frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-trust.labels" (dict "name" "admin-frontend") | nindent 8 }}
    spec:
      {{- include "ai-trust.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: admin-frontend
          image: {{ .Values.image.repository }}/admin-frontend:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
spec:
  selector:
    {{- include "ai-trust.labels" (dict "name" "admin-frontend") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
