# Overlay for local kind development. Applied on top of values.yaml by the
# Makefile (make install / make upgrade). Switches all infra services from
# ClusterIP (the default) to NodePort so that kind-config.yaml extraPortMappings
# can bind them to localhost, replicating the docker-compose host-port layout.
#
# DO NOT apply this overlay on a real cluster (Gardener or otherwise) — NodePort
# exposes these ports on every node's IP, bypassing the Ingress entirely.

# Pull secret for the private GHCR cognee-graph image (read-only prod test).
# Created by bootstrap.sh from GHCR_PULL_TOKEN in .env (same name as Gardener).
imagePullSecrets:
  - name: ghcr-pull-secret

postgres:
  serviceType: NodePort
  nodePort: 30432

rabbitmq:
  serviceType: NodePort
  nodePort: 30672

clickhouse:
  serviceType: NodePort
  nodePort: 30123

minio:
  image: ai-trust/minio:local
  mcImage: ai-trust/mc:local
  serviceType: NodePort
  apiNodePort: 30900
  consoleNodePort: 30901

keycloak:
  serviceType: NodePort
  nodePort: 30180

oauthProxy:
  serviceType: NodePort
  nodePort: 30080

otel:
  serviceType: NodePort
  collectorGrpcNodePort: 30317
  collectorHttpNodePort: 30318
  rmqBridgeNodePort: 30802

cogneeEval:
  enabled: true
  # Serves the frozen graph snapshot from GHCR (never ingests).
  # After each promote-graph.yml run, update graphImage to the new @sha256 digest.
  # Set readOnly: false only on a dedicated build/test instance for graph curation.
  readOnly: true
  graphImage: ghcr.io/ai-trust-services/ai-trust-platform/cognee-graph@sha256:09b6a4c90297f9f83caf09e71626df24d40028295b849088473f284b3a857495
