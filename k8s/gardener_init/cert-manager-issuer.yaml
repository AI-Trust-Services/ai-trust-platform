# One-time setup, applied to the SHOOT cluster - see k8s/README.md
#
# Creates a Let's Encrypt HTTP01 ClusterIssuer used by the Helm chart's
# Ingress (via cert-manager.io/cluster-issuer: letsencrypt-prod annotation
# in values-gardener.yaml) to auto-provision TLS certificates.
#
# cert-manager must already be running on the shoot (it is pre-installed on
# the sr-test shoot in the default namespace).
#
# Replace the email address below with a real one before applying.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: sebastian.rochacki@sap.com  # replace with a real email for cert expiry notices
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
