# One-time setup, applied to the SHOOT cluster (not the garden cluster) - see k8s/README.md.
# Grants the OIDC identity mapped by structured-auth-configmap.yaml (any GitHub Actions run in
# AI-Trust-Services/ai-trust-platform, any branch/ref) exactly the permissions
# bootstrap-gardener.yml needs: bootstrap.sh's namespace/Secret/ConfigMap/RBAC setup, plus
# applying OCM component CRs in ocm-system. Deliberately not cluster-admin.
#
# NOTE: the ai-trust namespace is NOT created here — bootstrap.sh creates it idempotently
# on every deploy. The ClusterRole grants create+patch so bootstrap can run from scratch.
---
# Cluster-scoped because Namespace is a cluster-scoped resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-trust-ci-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-trust-ci-namespace-reader
subjects:
  - kind: User
    name: "github.com:284992593:1285188431" # AI-Trust-Services/ai-trust-platform - see structured-auth-configmap.yaml
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: ai-trust-ci-namespace-reader
  apiGroup: rbac.authorization.k8s.io
---
# Everything else the Helm chart + bootstrap.sh manage, scoped to the ai-trust namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-trust-ci-deployer
  namespace: ai-trust
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert.gardener.cloud"]
    resources: ["certificates", "certificaterevocations"]
    verbs: ["get", "list", "watch"] # read-only — certs are managed by shoot-cluster-init.sh, not CI
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-trust-ci-deployer
  namespace: ai-trust
subjects:
  - kind: User
    name: "github.com:284992593:1285188431"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ai-trust-ci-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Permissions for bootstrap-gardener.yml to manage OCM CRs and the ghcr-credentials
# pull secret in ocm-system (the OCM controller's namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-trust-ci-ocm-manager
  namespace: ocm-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["delivery.ocm.software"]
    resources: ["componentversions", "resources", "fluxdeployers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-trust-ci-ocm-manager
  namespace: ocm-system
subjects:
  - kind: User
    name: "github.com:284992593:1285188431"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ai-trust-ci-ocm-manager
  apiGroup: rbac.authorization.k8s.io
