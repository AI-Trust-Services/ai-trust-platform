# Model B — used for AC2 (model switching demonstration).
# Set THALAMUS_MODEL=smollm2-360m in the ai-trust-env Secret to switch to this model.
# Requires ~8Gi RAM (vs 6Gi for smollm2-135m).
---
apiVersion: thalamus.cloud/v1alpha1
kind: Model
metadata:
  name: smollm2-360m
  namespace: thalamus
spec:
  backend: native
  replicas: 1
  serving:
    engine:
      image: docker.io/vllm/vllm-openai-cpu:v0.22.1
      args:
        - --max-model-len=2048
        - --max-num-seqs=1
        - --enforce-eager
        - --enable-auto-tool-choice
        - --tool-call-parser=apertus
      env:
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "1"
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: nobind
      resources:
        requests:
          cpu: 2000m
          memory: 8Gi
        limits:
          cpu: 4000m
          memory: 8Gi
    epp:
      image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi
  weights:
    type: hf
    hf:
      repoId: HuggingFaceTB/SmolLM2-360M-Instruct
      tokenSecret:
        name: hf-token
        key: HF_TOKEN
