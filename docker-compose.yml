x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ai_trust

x-rmq-env: &rmq-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

x-ch-env: &ch-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

services:
  shell:
    build: ./shell
    ports:
      - "8080:80"
    depends_on:
      ai-system-registry-frontend:
        condition: service_started
      ai-system-registry-backend:
        condition: service_healthy
      decision-trace-analyzer-frontend:
        condition: service_started
      monitoring-frontend:
        condition: service_started
      monitoring-backend:
        condition: service_healthy
      overview-frontend:
        condition: service_started
      overview-backend:
        condition: service_healthy
      alerts-frontend:
        condition: service_started
      alerts-backend:
        condition: service_healthy
      compliance-frontend:
        condition: service_started
      compliance-backend:
        condition: service_healthy
    restart: on-failure

  ai-system-registry-frontend:
    build:
      context: ./ai-system-registry/frontend
      args:
        VITE_REGISTRY_API_BASE: ${VITE_REGISTRY_API_BASE}
    ports:
      - "3001:80"
    restart: on-failure

  monitoring-frontend:
    build:
      context: ./monitoring/frontend
      args:
        VITE_MONITORING_API_BASE: ${VITE_MONITORING_API_BASE}
    ports:
      - "3002:80"
    restart: on-failure

  overview-frontend:
    build:
      context: ./overview/frontend
      args:
        VITE_OVERVIEW_API_BASE: ${VITE_OVERVIEW_API_BASE}
        VITE_ALERTS_API_BASE: ${VITE_ALERTS_API_BASE}
        VITE_ALERTS_URL: ${VITE_ALERTS_URL}
    ports:
      - "3003:80"
    restart: on-failure

  alerts-frontend:
    build:
      context: ./alerts/frontend
      args:
        VITE_ALERTS_API_BASE: ${VITE_ALERTS_API_BASE}
        VITE_ALERTS_URL: ${VITE_ALERTS_URL}
    ports:
      - "3004:80"
    restart: on-failure

  compliance-frontend:
    build:
      context: ./compliance/frontend
      args:
        VITE_COMPLIANCE_API_BASE: ${VITE_COMPLIANCE_API_BASE:-http://localhost:8007/api/v1}
        VITE_REGISTRY_API_BASE: ${VITE_REGISTRY_API_BASE:-http://localhost:8001/api/v1}
    ports:
      - "3006:80"
    restart: on-failure

  db-migrate:
    build: ./libs/persistence
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  ai-system-registry-backend:
    build:
      context: .
      dockerfile: ai-system-registry/backend/Dockerfile
    ports:
      - "8001:8001"
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:8080,http://localhost:3006"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  monitoring-backend:
    build:
      context: .
      dockerfile: monitoring/backend/Dockerfile
    ports:
      - "8003:8003"
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:3002,http://localhost:8080"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  overview-backend:
    build:
      context: .
      dockerfile: overview/backend/Dockerfile
    ports:
      - "8004:8004"
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:3003,http://localhost:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  alerts-backend:
    build:
      context: .
      dockerfile: alerts/backend/Dockerfile
    ports:
      - "8005:8005"
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:3004,http://localhost:8080,http://localhost:3001,http://localhost:3002,http://localhost:3003"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  compliance-backend:
    build:
      context: .
      dockerfile: compliance/backend/Dockerfile
    ports:
      - "8007:8007"
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:3006,http://localhost:8080,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_REGION: ${MINIO_REGION}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  policy-checker-worker:
    build:
      context: .
      dockerfile: policy-checker-worker/Dockerfile
    environment:
      <<: *db-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      ALERT_POLL_INTERVAL: "10"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:24.5-alpine
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./otel-pipeline/clickhouse-config/config.d:/etc/clickhouse-server/config.d:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      <<: *minio-env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      <<: *minio-env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/clickhouse &&
      mc mb --ignore-existing local/evidence-files
      "
    restart: on-failure

  clickhouse-migrate:
    build: ./libs/clickhouse
    environment:
      <<: *ch-env
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: on-failure

  otel-rmq-bridge:
    build: ./otel-pipeline/rmq-bridge
    ports:
      - "8002:8002"
    environment:
      <<: *rmq-env
      RMQ_CONNECT_RETRIES: ${RMQ_CONNECT_RETRIES:-10}
      RMQ_CONNECT_DELAY: ${RMQ_CONNECT_DELAY:-3.0}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    volumes:
      - ./otel-pipeline/collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      otel-rmq-bridge:
        condition: service_healthy
    restart: on-failure

  otel-clickhouse-consumer:
    build:
      context: .
      dockerfile: consumers/clickhouse-consumer/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      BATCH_SIZE: "100"
      BATCH_TIMEOUT: "5"
      <<: *ch-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    restart: on-failure

  decision-trace-analyzer-frontend:
    build:
      context: ./decision-trace-analyzer/frontend
      args:
        VITE_DTA_API_BASE: ${VITE_DTA_API_BASE}
    ports:
      - "3005:80"
    depends_on:
      decision-trace-analyzer-backend:
        condition: service_healthy
    restart: on-failure

  decision-trace-analyzer-backend:
    build:
      context: .
      dockerfile: decision-trace-analyzer/backend/Dockerfile
    ports:
      - "8006:8006"
    environment:
      <<: *ch-env
      ALLOWED_ORIGINS: "http://localhost:3005,http://localhost:8080"
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
