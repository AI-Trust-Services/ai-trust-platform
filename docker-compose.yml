x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ai_trust

x-rmq-env: &rmq-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

x-ch-env: &ch-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

x-openfga-env: &openfga-env
  OPENFGA_URL: http://openfga:8080

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure

  keycloak-provision:
    build: ./infra/keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      USERS_BACKEND_CLIENT_SECRET: ${USERS_BACKEND_CLIENT_SECRET}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
    depends_on:
      keycloak:
        condition: service_healthy
    restart: on-failure

  # ── OpenFGA (authorization) ──
  openfga-migrate:
    image: openfga/openfga:v1.18.1
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  openfga:
    image: openfga/openfga:v1.18.1
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      # OpenFGA ships grpc_health_probe in the image; probe the gRPC port (8081).
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  openfga-provision:
    build:
      context: .
      dockerfile: infra/openfga-provision/Dockerfile
    environment:
      <<: *openfga-env
      INITIAL_ADMIN_USER: ${APP_ADMIN_USERNAME}
    volumes:
      - openfga-config:/config
    depends_on:
      openfga:
        condition: service_healthy
    restart: on-failure

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    ports:
      - "8080:4180"
    command:
      - --provider=oidc
      - --client-id=oauth2-proxy
      - --client-secret=${KEYCLOAK_CLIENT_SECRET}
      - --oidc-issuer-url=http://keycloak:8080/realms/ai-trust
      - --login-url=${KEYCLOAK_PUBLIC_URL}/realms/ai-trust/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/ai-trust/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/ai-trust/protocol/openid-connect/certs
      # skip-oidc-discovery + insecure-oidc-skip-issuer-verification: needed because
      # Keycloak's internal issuer (http://keycloak:8080) differs from the public browser URL
      # (KEYCLOAK_PUBLIC_URL). The JWT issuer claim would not match --oidc-issuer-url otherwise.
      # Production alternative: set KC_HOSTNAME in Keycloak so the issuer claim matches the
      # public URL, then remove both flags and drop the manual --login-url/--redeem-url/--oidc-jwks-url.
      - --skip-oidc-discovery=true
      - --insecure-oidc-skip-issuer-verification=true
      - --redirect-url=${APP_PUBLIC_URL}/oauth2/callback
      - --upstream=http://shell:80
      - --http-address=0.0.0.0:4180
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      # cookie-secure=false: required for HTTP localhost dev. Must be true in production (HTTPS).
      - --cookie-secure=false
      - --email-domain=*
      - --pass-authorization-header=true
      - --backend-logout-url=http://keycloak:8080/realms/ai-trust/protocol/openid-connect/logout?id_token_hint={id_token}
    depends_on:
      keycloak-provision:
        condition: service_completed_successfully
      shell:
        condition: service_started
    restart: on-failure

  shell:
    build: ./shell
    depends_on:
      ai-system-registry-frontend:
        condition: service_started
      ai-system-registry-backend:
        condition: service_healthy
      decision-trace-analyzer-frontend:
        condition: service_started
      decision-trace-analyzer-backend:
        condition: service_healthy
      monitoring-frontend:
        condition: service_started
      monitoring-backend:
        condition: service_healthy
      overview-frontend:
        condition: service_started
      overview-backend:
        condition: service_healthy
      alerts-frontend:
        condition: service_started
      alerts-backend:
        condition: service_healthy
      compliance-frontend:
        condition: service_started
      compliance-backend:
        condition: service_healthy
      users-frontend:
        condition: service_started
      users-backend:
        condition: service_healthy
      risk-management-frontend:
        condition: service_started
      risk-management-backend:
        condition: service_healthy
    restart: on-failure

  ai-system-registry-frontend:
    build:
      context: ./ai-system-registry/frontend
      args:
        VITE_REGISTRY_API_BASE: ${VITE_REGISTRY_API_BASE}
        VITE_USERS_API_BASE: ${VITE_USERS_API_BASE:-/api/users/v1}
    restart: on-failure

  monitoring-frontend:
    build:
      context: ./monitoring/frontend
      args:
        VITE_MONITORING_API_BASE: ${VITE_MONITORING_API_BASE}
    restart: on-failure

  overview-frontend:
    build:
      context: ./overview/frontend
      args:
        VITE_OVERVIEW_API_BASE: ${VITE_OVERVIEW_API_BASE}
        VITE_ALERTS_API_BASE: ${VITE_ALERTS_API_BASE}
        VITE_ALERTS_URL: ${VITE_ALERTS_URL}
        VITE_REGISTRY_URL: ${VITE_REGISTRY_URL}
        VITE_COMPLIANCE_URL: ${VITE_COMPLIANCE_URL}
        VITE_COMPLIANCE_API_BASE: ${VITE_COMPLIANCE_API_BASE}
        VITE_USERS_API_BASE: ${VITE_USERS_API_BASE:-/api/users/v1}
    restart: on-failure

  alerts-frontend:
    build:
      context: ./alerts/frontend
      args:
        VITE_ALERTS_API_BASE: ${VITE_ALERTS_API_BASE}
        VITE_ALERTS_URL: ${VITE_ALERTS_URL}
        VITE_USERS_API_BASE: ${VITE_USERS_API_BASE:-/api/users/v1}
    restart: on-failure

  compliance-frontend:
    build:
      context: ./compliance/frontend
      args:
        VITE_COMPLIANCE_API_BASE: ${VITE_COMPLIANCE_API_BASE:-/api/compliance/v1}
        VITE_REGISTRY_API_BASE: ${VITE_REGISTRY_API_BASE:-/api/registry/v1}
        VITE_USERS_API_BASE: ${VITE_USERS_API_BASE:-/api/users/v1}
    restart: on-failure

  users-frontend:
    build:
      context: ./users/frontend
      args:
        VITE_USERS_API_BASE: ${VITE_USERS_API_BASE:-/api/users/v1}
    restart: on-failure

  users-backend:
    build:
      context: .
      dockerfile: users/backend/Dockerfile
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:8080"
      ROOT_PATH: "/api/users"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ai-trust
      USERS_BACKEND_CLIENT_ID: users-backend
      USERS_BACKEND_CLIENT_SECRET: ${USERS_BACKEND_CLIENT_SECRET}
      OPENFGA_URL: http://openfga:8080
    volumes:
      - openfga-config:/config:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak-provision:
        condition: service_completed_successfully
      openfga-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure

  db-migrate:
    build: ./libs/persistence
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  ai-system-registry-backend:
    build:
      context: .
      dockerfile: ai-system-registry/backend/Dockerfile
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:8080"
      ROOT_PATH: "/api/registry"
      OPENFGA_URL: http://openfga:8080
      KEYCLOAK_URL: http://keycloak:8080
      USERS_BACKEND_URL: http://users-backend:8008
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AI Trust Platform}
      SMTP_SSL: ${SMTP_SSL}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
    volumes:
      - openfga-config:/config:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      openfga-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  monitoring-backend:
    build:
      context: .
      dockerfile: monitoring/backend/Dockerfile
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:8080"
      ROOT_PATH: "/api/monitoring"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      OPENFGA_URL: http://openfga:8080
    volumes:
      - openfga-config:/config:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      openfga-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  overview-backend:
    build:
      context: .
      dockerfile: overview/backend/Dockerfile
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:8080"
      ROOT_PATH: "/api/overview"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  alerts-backend:
    build:
      context: .
      dockerfile: alerts/backend/Dockerfile
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:8080"
      ROOT_PATH: "/api/alerts"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      OPENFGA_URL: http://openfga:8080
    volumes:
      - openfga-config:/config:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
      openfga-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  compliance-backend:
    build:
      context: .
      dockerfile: compliance/backend/Dockerfile
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:8080"
      ROOT_PATH: "/api/compliance"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_REGION: ${MINIO_REGION}
      OPENFGA_URL: http://openfga:8080
    volumes:
      - openfga-config:/config:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      openfga-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  policy-checker-worker:
    build:
      context: .
      dockerfile: policy-checker-worker/Dockerfile
    environment:
      <<: *db-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      ALERT_POLL_INTERVAL: "10"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
    restart: on-failure

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:24.5-alpine
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./otel-pipeline/clickhouse-config/config.d:/etc/clickhouse-server/config.d:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      <<: *minio-env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      <<: *minio-env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/clickhouse &&
      mc mb --ignore-existing local/evidence-files
      "
    restart: on-failure

  clickhouse-migrate:
    build: ./libs/clickhouse
    environment:
      <<: *ch-env
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: on-failure

  otel-rmq-bridge:
    build: ./otel-pipeline/rmq-bridge
    ports:
      - "8002:8002"
    environment:
      <<: *rmq-env
      RMQ_CONNECT_RETRIES: ${RMQ_CONNECT_RETRIES:-10}
      RMQ_CONNECT_DELAY: ${RMQ_CONNECT_DELAY:-3.0}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    volumes:
      - ./otel-pipeline/collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      otel-rmq-bridge:
        condition: service_healthy
    restart: on-failure

  otel-clickhouse-consumer:
    build:
      context: .
      dockerfile: consumers/clickhouse-consumer/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      BATCH_SIZE: "100"
      BATCH_TIMEOUT: "5"
      <<: *ch-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    restart: on-failure

  decision-trace-analyzer-frontend:
    build:
      context: ./decision-trace-analyzer/frontend
      args:
        VITE_DTA_API_BASE: ${VITE_DTA_API_BASE}
    depends_on:
      decision-trace-analyzer-backend:
        condition: service_healthy
    restart: on-failure

  decision-trace-analyzer-backend:
    build:
      context: .
      dockerfile: decision-trace-analyzer/backend/Dockerfile
    environment:
      <<: *ch-env
      ALLOWED_ORIGINS: "http://localhost:8080"
      ROOT_PATH: "/api/dta"
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: on-failure

  risk-management-frontend:
    build:
      context: ./risk-management/frontend
      args:
        VITE_RISK_MANAGEMENT_API_BASE: ${VITE_RISK_MANAGEMENT_API_BASE:-/api/risk-management/v1}
    restart: on-failure

  risk-management-backend:
    build:
      context: .
      dockerfile: risk-management/backend/Dockerfile
      args:
        INSTALL_NEXUS: ${INSTALL_NEXUS:-false}
    environment:
      ALLOWED_ORIGINS: "http://localhost:8080"
      ROOT_PATH: "/api/risk-management"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host-gateway:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure

volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
  openfga-config:
