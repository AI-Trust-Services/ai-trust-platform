x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ai_trust

x-rmq-env: &rmq-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

x-ch-env: &ch-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

services:
  shell:
    build: ./shell
    ports:
      - "8080:80"
    depends_on:
      ai-system-registry-frontend:
        condition: service_started
      ai-system-registry-backend:
        condition: service_healthy
      monitoring-frontend:
        condition: service_started
      monitoring-backend:
        condition: service_healthy

  ai-system-registry-frontend:
    build:
      context: ./ai-system-registry/frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE}
    ports:
      - "3001:80"

  monitoring-frontend:
    build:
      context: ./monitoring/frontend
      args:
        VITE_MONITORING_API_BASE: ${VITE_MONITORING_API_BASE}
    ports:
      - "3002:80"

  db-migrate:
    build: ./libs/persistence
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  ai-system-registry-backend:
    build:
      context: .
      dockerfile: ai-system-registry/backend/Dockerfile
    ports:
      - "8001:8001"
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  monitoring-backend:
    build:
      context: .
      dockerfile: monitoring/backend/Dockerfile
    ports:
      - "8003:8003"
    environment:
      <<: *db-env
      ALLOWED_ORIGINS: "http://localhost:3002,http://localhost:8080"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.5-alpine
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-migrate:
    build: ./libs/clickhouse
    environment:
      <<: *ch-env
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: on-failure

  otel-rmq-bridge:
    build: ./otel-pipeline/rmq-bridge
    ports:
      - "8002:8002"
    environment:
      <<: *rmq-env
      RMQ_CONNECT_RETRIES: ${RMQ_CONNECT_RETRIES:-10}
      RMQ_CONNECT_DELAY: ${RMQ_CONNECT_DELAY:-3.0}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    volumes:
      - ./otel-pipeline/collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      otel-rmq-bridge:
        condition: service_healthy

  otel-clickhouse-consumer:
    build:
      context: .
      dockerfile: consumers/clickhouse-consumer/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      <<: *ch-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  postgres_data:
  clickhouse_data:
