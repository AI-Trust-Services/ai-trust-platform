server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "frame-ancestors 'self'";

    # The SPA entry point must never be cached: it names the current hashed asset bundle. The no-cache
    # header is set on location / (not just = /index.html) because the shell proxy requests "/" and
    # try_files serves index.html under that path — the exact-match location never fires for proxied
    # requests from the shell. Both locations cover all request shapes: direct /index.html and the
    # SPA fallback from /.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self'";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self'";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN";
    }
}
