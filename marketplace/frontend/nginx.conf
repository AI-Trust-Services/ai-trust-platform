server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "frame-ancestors 'self'";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA entry point must never be cached: it names the current hashed asset bundle, and after a
    # redeploy the old hashes 404 (nginx then serves this very index.html as the SPA fallback with a
    # text/html MIME → "Refused to apply style" + missing chunk). An exact-match location wins over the
    # asset regex below, so index.html is always revalidated while the fingerprinted assets stay cached.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self'";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN";
    }
}
